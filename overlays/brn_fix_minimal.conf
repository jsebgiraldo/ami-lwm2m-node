# Minimalist AMI build: keeps only Power Meter (V/I/P) + FW Update.
#
# Combines:
#   - sed_aggressive (60 s poll, 0 dBm, child timeout 30 min, LED quiet)
#   - CoAP block 64 (each block-1 TX ~1.2 ms, well below USB host
#     overcurrent integration window)
#   - AMI_MINIMAL_AMI=y (skip Objects 3303 temp, 33000 diag, 33001 thread
#     role, 3311 light control, 10483-10486 thread net/neighbor/commission/
#     cli)
#
# Net effect on LwM2M TX activity:
#   - Initial REGISTER payload shrinks ~80 % (no custom objects to advertise)
#   - Periodic observe push covers only V / I / P (~12 bytes vs 800+)
#   - No more 36-RID Object 33000 push that previously triggered the cliff

CONFIG_AMI_MINIMAL_AMI=y
CONFIG_LWM2M_COAP_BLOCK_SIZE=64
