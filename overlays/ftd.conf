# Variant: FTD (Full Thread Device, router-eligible).
# Reserve for nodes that should help carry mesh traffic or act as gateway-side
# routers. Use this variant for ~5-10% of the fleet.

CONFIG_OPENTHREAD_FTD=y
CONFIG_OPENTHREAD_MTD=n

# Mirror Espressif's CONFIG_ESP_PHY_REDUCE_TX_POWER (Zephyr doesn't source it).
# After a BRN reset, main.c drops the TX power to AMI_POST_BRN_TX_POWER_DBM for
# this boot only — short range but breaks the brownout-cascade so the chip can
# stabilize before another full-power TX burst dips the rail again. On the next
# clean boot (POR/SW/WDOG) the standard AMI_TX_POWER_DBM resumes.
CONFIG_AMI_POST_BRN_REDUCE_TX=y
