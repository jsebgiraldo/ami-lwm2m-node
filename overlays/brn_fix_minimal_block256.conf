# Variant of brn_fix_minimal.conf with CoAP block 256 instead of 64.
# Trades a small amount of cliff margin for 4x faster OTA (650 KB image
# downloads in ~8 s vs ~30 s at block=64).
#
# Block-size vs TX burst (empirical, ESP32-C6 802.15.4 at 4 dBm):
#   64  -> ~1.2 ms per block
#   128 -> ~2.5 ms per block
#   256 -> ~5 ms per block  <- this overlay
#   512 -> ~10 ms per block   *** triggers USB host overcurrent cliff ***
#   1024 -> ~20 ms per block  *** definitely triggers cliff ***
#
# 5 ms stays well under the typical 10-50 ms USB host overcurrent
# integration window, so it should not trip the cliff. Empirical verification
# required on MINI_L1 before fleet rollout.

CONFIG_AMI_MINIMAL_AMI=y
CONFIG_LWM2M_COAP_BLOCK_SIZE=256
