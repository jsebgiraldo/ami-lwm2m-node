# RTT logging over JTAG — non-intrusive, per-tick visibility on serial-less
# SuperMini. The firmware writes its LOG_* stream to a RAM ring buffer that
# OpenOCD reads live WITHOUT halting the core (unlike a JTAG halt, which pauses
# the radio and itself triggers recovery). This is how we watch every tick and
# capture the exact reboot reason string (ami_reboot_drain logs "REBOOT (<why>)"
# right before sys_reboot).
# ESP32-C6 SoC doesn't `select HAS_SEGGER_RTT` (Zephyr gates it to J-Link
# platforms), but RTT is just a RAM ring buffer that OpenOCD reads generically.
# Force the gate so USE_SEGGER_RTT becomes settable.
CONFIG_HAS_SEGGER_RTT=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=16384
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=512
# IMMEDIATE so the reboot-reason LOG_ERR flushes to RTT before sys_reboot fires
# (deferred mode can lose the last lines when the kernel resets).
CONFIG_LOG_MODE_IMMEDIATE=y
# Keep the subsystems we care about audible at INFO.
CONFIG_LOG_DEFAULT_LEVEL=3
