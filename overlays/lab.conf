# Mesh target: LAB benchtop OTBR on THIS Windows PC.
#   RCP  = SONOFF ZBDongle-E (EFR32MG21) running ot-rcp
#   OTBR = openthread/otbr docker container inside WSL2
#
# Generated by tools/lab_thread_creds.py from the OTBR active dataset.
# The REAL dataset is the TLV blob in src/main.c (apply_otbr_dataset,
# CONFIG_AMI_MESH_LAB branch); the values below are cosmetic - they only
# feed the startup banner "Network: Thread Ch%d PAN 0x%04X".
#
# Build:
#   python tools/build_firmware.py --variant med --mesh lab
# or:
#   west build ... -- -DEXTRA_CONF_FILE="overlays/med.conf;overlays/lab.conf"

CONFIG_AMI_MESH_LAB=y

# Cosmetic Kconfig values (must match the compiled-in TLV blob).
CONFIG_OPENTHREAD_CHANNEL=11
CONFIG_OPENTHREAD_PANID=14656
CONFIG_OPENTHREAD_NETWORK_NAME="GatewaySmartGrid"
CONFIG_OPENTHREAD_XPANID="84:bc:42:45:70:87:d8:e0"
CONFIG_OPENTHREAD_NETWORKKEY="b6:70:cc:4d:5d:50:bb:50:5e:38:10:57:5b:6f:9f:76"

# --- Watchdog policy: PRODUCTION values (v0.7.18, 2026-08-05) ---------------
# The bench used to disable the registration-gated safety reboots
#   CONFIG_AMI_BOOT_REGISTER_DEADLINE_S=0
#   CONFIG_AMI_HW_WATCHDOG_BOOT_GRACE_HARD_S=3600
# because it had NO LwM2M server, so the node never got a server-ACKed REGISTER
# and rebooted about every 180 s. That made the bench validate a configuration we
# never ship — the opposite of what a bench is for.
#
# The bench now runs its own ThingsBoard (tools/lab_tb/, discovered over SRP;
# see docs/LAB_THINGSBOARD.md), the node REGISTERs normally, and those overrides
# are deliberately REMOVED so every watchdog here behaves exactly as in the
# field. If the node starts rebooting again, that is a REAL finding, not a bench
# artefact — capture the console (overlays/console_uart0.overlay) before changing
# anything back.

# --- Bench-only fault injection -------------------------------------------
# `ami test panic null CONFIRM` crashes the node at a known source line so the
# v0.7.18 panic forensics (RIDs 39/40/41) can be VALIDATED: addr2line on mepc
# must resolve to that exact line, which is the check docs/PENDIENTES.md 2.2
# asks for. Default n in Kconfig — never built into a fleet image.
CONFIG_AMI_TEST_FAULT=y
