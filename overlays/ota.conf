# OTA overlay (v0.6.27) — apply ONLY for MCUboot/OTA-enabled builds.
#
# Compose AFTER med.conf + r1000.conf, and build with --sysbuild so the
# MCUboot bootloader image is also produced. Do NOT add these to prj.conf:
# CONFIG_BOOTLOADER_MCUBOOT links the app at the slot0 offset (0x20000) and
# adds a signed MCUboot header — a node flashed that way at 0x0 (the legacy
# onboard_node.py path) would not boot. Keep this opt-in until the whole
# fleet is migrated.

# Build the app as a slot0 MCUboot image (signed, headered, linked @0x20000).
CONFIG_BOOTLOADER_MCUBOOT=y

# Runtime flash-write path for receiving an OTA image into slot1:
#   firmware_update.c -> flash_img_buffered_write() -> stream_flash -> slot1
CONFIG_STREAM_FLASH=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# Larger CoAP block + buffer so OTA over Thread is not glacial. The LwM2M
# firmware object pulls blocks via blockwise CoAP; bigger blocks = fewer
# round-trips across the mesh.
CONFIG_LWM2M_COAP_BLOCK_SIZE=1024
