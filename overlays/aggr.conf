# Aggressive tuning (v0.7.6-aggr) — TEST build.
# Priority: the node must NEVER get STUCK; minimizing reboots is a bonus.
# Combine AFTER overlays/resprobe_lwm2m.conf so the block-size override wins:
#   ftd.conf + resprobe_lwm2m.conf + prod_fat.conf + aggr.conf
# Validate on a SUBSET before fleet-wide.

# --- Faster liveness detection + recovery (catch a stuck node sooner) ---
# REG_UPDATE every 150s (was 300): feeds both watchdogs + probes the socket 2x
# more often. Liveness gate at 400s (was 600) = 2.6x margin over 150s.
CONFIG_LWM2M_UPDATE_PERIOD=150
CONFIG_AMI_REAL_LIVENESS_TIMEOUT_S=400
# Extra socket probe 2.5x more often (redundant w/ REG_UPDATE but = more chances
# to catch a wedged socket; BUG #1 is fixed so it's safe).
CONFIG_AMI_COAP_KEEPALIVE_PERIOD_S=120

# --- Soft-recovery FIRST, but faster; reboot a bit sooner if soft fails ---
CONFIG_AMI_LWM2M_RECOVER_BACKOFF_MIN_S=30
CONFIG_AMI_LWM2M_RECOVER_BACKOFF_MAX_S=120
CONFIG_AMI_LWM2M_RECOVER_MAX_ATTEMPTS=8

# --- No USB host on the PSU: drop the 5s reboot drain -> recovery 4.5s faster ---
CONFIG_AMI_REBOOT_USB_DRAIN_MS=500

# --- Faster telemetry: pmin = NOTIFY_MIN_INTERVAL/1000 = 15s (on-change) ---
# (pmax stays 60s; lower it in code later if the AI cadence needs <60s guaranteed.)
CONFIG_AMI_LWM2M_NOTIFY_MIN_INTERVAL_MS=15000

# --- Big CoAP block: external power, fewer round-trips for large messages ---
# (REGISTER / Object 33000 reads in 1 block instead of 8). MAX_MSG_SIZE=1232>1024.
# NOTE: on a marginal RF link a dropped frame retransmits the whole 1024B block,
# so watch the marginal boards (f788/f6d4) — big blocks help good links, can hurt
# flaky ones.
CONFIG_LWM2M_COAP_BLOCK_SIZE=1024
