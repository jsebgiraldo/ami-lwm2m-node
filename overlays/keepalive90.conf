# A/B #1 TEST ARM (v0.7.8-ka90) — faster keepalive detection.
#
# Baseline finding (2026-06-17, tools/flicker_baseline.py): the TB-Edge
# inactive flicker is contained to ~7 RF-marginal boards whose MESH session
# drops recover with a UNIFORM ~585-622s outage. That ~600s = ~2 intervals of
# CONFIG_AMI_COAP_KEEPALIVE_PERIOD_S (300s) x the 3-fail recover threshold:
# the board stays attached but its session goes stale, and the slow keepalive
# takes ~600s to detect + fire recover_work (re-register).
#
# This shortens the keepalive detection window 300 -> 90s. Expected: the
# outage drops ~600s -> ~180s, so the cosmetic 'inactive' flicker becomes a
# brief blip. The keepalive is one tiny CoAP notify on /33000/0/10; 3.3x of a
# tiny probe is still negligible vs the 35-resource observe telemetry, so this
# does NOT meaningfully add channel traffic (the no-congestion constraint holds).
#
# Threshold stays 3 (matches the CoAP CON retransmit budget) — only the period
# changes, so the A/B isolates a single variable. Combine AFTER the prod
# overlays (ftd + resprobe_lwm2m + prod_fat). Validate vs build_prod (300s)
# control on a subset before fleet-wide.
CONFIG_AMI_COAP_KEEPALIVE_PERIOD_S=90
