# Test overlay: run the SPI flash at 40 MHz instead of 80 MHz.
# Some board batches have flash chips marginal at 80 MHz -> MCUboot hangs
# reading flash -> TG0/LP watchdog boot-loop (Saved PC fixed in MCUboot).
# 40 MHz is the standard compatibility fallback (slightly slower boot).
# Applied to BOTH the app and the mcuboot image (see build invocation).
CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
