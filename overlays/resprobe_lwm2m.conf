# Resource-probe variant readable over LwM2M (no serial needed).
# Combine with overlays/ftd.conf + overlays/resource_probe.conf.
# Object 33000 stays ENABLED (NOT minimal AMI) so RID 36 heap_min_free_live
# carries the un-blinded heap signal to TB. Block 64 keeps the larger 33000
# REGISTER/notify bursts under the USB-overcurrent threshold.
CONFIG_LWM2M_COAP_BLOCK_SIZE=64
