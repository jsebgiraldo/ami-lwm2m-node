# Fat-production fleet config (v0.7.5-prod) — the validated config of the 3
# boards that ran 10.5h / 0 resets, MINUS the serial-only debug instrumentation.
#
# Combine with: overlays/ftd.conf + overlays/resprobe_lwm2m.conf
#   ftd.conf            -> FTD (router-eligible; Object 33001 + router-threshold
#                          self-regulate how many routers are active)
#   resprobe_lwm2m.conf -> CONFIG_LWM2M_COAP_BLOCK_SIZE=64 (USB-cliff-safe)
#   (NOT minimal)       -> Object 33000 ON = full diagnostics + RID 37
#                          (reboot self-documentation), readable from the server
#   prj.conf            -> Fix A: CONFIG_LWM2M_UPDATE_PERIOD=300 (THE stability
#                          fix — kills the ~700s HW-liveness reboot loop)
#   mesh                -> R1000 (Kconfig default), same network as the fleet
#
# This is the fat-firmware / thin-server-profile architecture: every feature in
# the firmware, limited from the server side. The ONLY thing dropped vs the
# test build is overlays/resource_probe.conf (THREAD_ANALYZER every 20s + a
# KERNEL_SHELL that is unreachable on the serial-less SuperMini) — pure debug
# overhead that contributed nothing to stability (Fix A did).
#
# Kept from resource_probe: SYS_HEAP_RUNTIME_STATS, which feeds Object 33000
# RID 36 (heap_min_free_live) so heap headroom stays monitorable over RPC.
CONFIG_SYS_HEAP_RUNTIME_STATS=y
