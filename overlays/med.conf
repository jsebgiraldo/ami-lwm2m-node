# Variant: MED (Minimal End Device, MTD compile-time).
# Default role for production fleet. RxOnWhenIdle=true (always-listening, mains-powered).
# Cannot be promoted to Router/Leader. Smaller binary, less RAM/flash.
# To convert a node to FTD: reflash with the ftd variant.

CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_FTD=n

# v0.6.46 MTD overlay needs IMG_MANAGER explicitly: en FTD build se auto-habilita
# por alguna dependencia Kconfig indirecta, pero con FTD=n se cae y
# src/firmware_update.c no compila (CONFIG_IMG_BLOCK_BUF_SIZE undeclared).
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
