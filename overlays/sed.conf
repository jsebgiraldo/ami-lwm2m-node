# Variant: SED (Sleepy End Device).
#
# Use for SuperMini boards whose flaky power supply can't sustain continuous
# 802.15.4 router-mode TX bursts (chronic BRN resets, see brownout root cause
# analysis 2026-06-08). As SED, the radio is off ~99% of the time, polling
# the parent only every POLL_PERIOD ms. Each TX event is still ~130 mA peak
# but they happen 50-100x less frequently, so brownout events drop
# proportionally.
#
# Pairs with FTD routers (use overlays/ftd.conf for ~5-7 XIAO ESP32-C6 boards
# that have the better Seeed power design). One FTD parent can hold ~32 SED
# children, so 7 routers x 32 = 224 SED capacity — plenty for 30-node fleet.
#
# Trade-offs:
#   - Telemetry latency = poll period (5 s default here)
#   - LwM2M observe → notify queues at server until next poll
#   - No router promotion, no leader role
#   - Can't act as relay for other nodes
#
# To build:
#   west build -d build_sed -b xiao_esp32c6/esp32c6/hpcore \
#     <source> -- -DEXTRA_CONF_FILE="overlays/sed.conf;overlays/ota.conf"

# === Thread role ===
CONFIG_OPENTHREAD_FTD=n
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y

# Poll parent every 5 s. Short enough to feel responsive for AMI metering
# (telemetry shows up within 5-10 s), long enough that ~99% of the time the
# radio is off and the chip is in light sleep.
CONFIG_OPENTHREAD_POLL_PERIOD=5000

# === MTD_SED requires IMG_MANAGER explicitly (same as med.conf, MCUboot OTA) ===
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# === LwM2M Queue Mode (binding=UQ) ===
# Required for SED: client registers with "Q" binding flag, server queues
# notifications until next observed wake-up.
CONFIG_LWM2M_QUEUE_MODE_ENABLED=y
# Stay online 60 s after each emit. Long enough that the registration update
# completes cleanly and a server-pushed Write back lands before we go quiet.
CONFIG_LWM2M_QUEUE_MODE_UPTIME=60

# === TX power: keep at 4 dBm (Kconfig default) ===
# Even though the radio is mostly off, when it DOES TX we want enough range
# to reach the parent router. Dropping below 0 dBm has historically caused
# mesh collapse (memory: project_tx_power_minus16_caused_psu_mesh_collapse).
CONFIG_AMI_TX_POWER_DBM=4
