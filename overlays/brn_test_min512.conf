# Sanity-check overlay: minimal AMI but with the ORIGINAL block size 512.
# Closes the causal loop: if this cliffs, block size is the causal factor
# even with small payloads; if it doesn't, the Object 33000 payload size
# was the dominant factor and 512 is fine for minimal builds.
CONFIG_AMI_MINIMAL_AMI=y
CONFIG_LWM2M_COAP_BLOCK_SIZE=512
