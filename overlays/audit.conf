# EXTREME AUDIT overlay (v0.7.9-dlv-audit) — stack / RAM / overflow / CPU
# instrumentation for the 16-node bench round. Layer LAST, on top of the
# normal prod overlays + keepalive90. Console is USB-Serial-JTAG; capture it
# with tools/audit_console_capture.py across all 16 ports.
#
# Goal: find the threads closest to their stack ceiling (Bug #5 was an ISR
# stack overflow caught exactly this way), watch live heap/RAM trend, catch
# any stack-overflow fault in the act, and see per-thread CPU% (the ISR0=100%
# signature). This does NOT change runtime behavior of the mesh/LwM2M paths —
# it only adds observability, so the audited nodes still represent production.

# ── Thread analyzer: periodic per-thread stack high-water + CPU% ──────
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048

# Prerequisites for the analyzer to read names + stack usage.
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
# Fill unused stack with a known pattern so high-water marks are measurable
# from the first byte (otherwise "used" reads as full on never-touched stacks).
CONFIG_INIT_STACKS=y

# ── Per-thread runtime CPU stats (catch the ISR0=100% / starved-thread
# signature that pointed at Bug #5). Adds the CPU% column to the analyzer. ──
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y

# ── Stack-overflow detection ──────────────────────────────────────────
# Software sentinel: a canary word at the stack limit; a fault fires the
# moment it is clobbered (instead of silent corruption). Cheap, always on.
CONFIG_STACK_SENTINEL=y
# Hardware (PMP) stack guard on RISC-V: an MPU region faults on overflow
# before the canary is even reached. If the build rejects this on the
# Espressif port, drop this one line and keep the sentinel.
CONFIG_HW_STACK_PROTECTION=y

# ── Fault/assert visibility so a trip is loud on the console ──────────
CONFIG_ASSERT=y
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_THREAD_ANALYZER_AUTO_SEPARATE_CORES=n
