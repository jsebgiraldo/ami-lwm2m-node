# Mesh target: UNAL-Thread on Pi4 EKH01 (192.168.1.111, channel 25)
#
# This is the original / legacy deployment.
#
# Usage (combined with med or ftd variant):
#   west build ... -- -DEXTRA_CONF_FILE="overlays/med.conf;overlays/pi4.conf"
# Or via tools/build_firmware.py:
#   python tools/build_firmware.py --variant med --mesh pi4
#
# Reference: docs/architecture/edge-thingsboard.md
#            (in the OpenWrt repo: docs/architecture/edge-thingsboard.md)

CONFIG_AMI_MESH_PI4=y

# Cosmetic Kconfig values (real dataset comes from TLV blob in main.c).
# Kept aligned so that startup banner ("Network: Thread Ch%d PAN 0x%04X")
# reports the correct values.
CONFIG_OPENTHREAD_CHANNEL=25
CONFIG_OPENTHREAD_PANID=9197
CONFIG_OPENTHREAD_NETWORK_NAME="UNAL-Thread"
CONFIG_OPENTHREAD_XPANID="1a:25:78:dd:6e:e3:57:3b"
CONFIG_OPENTHREAD_NETWORKKEY="5e:de:be:ad:64:40:5b:3e:17:19:36:46:c2:94:22:85"

# LwM2M server discovery: DNS-SD only (v0.6.0+). See overlays/r1000.conf
# for rationale. The pi4 mesh's OTBR also publishes _lwm2m._udp via SRP.
