# Diagnostic overlay: isolate whether LwM2M is what triggers the chronic
# USB-VBUS-cut events.
#
# Combines kitchen-sink SED with CONFIG_AMI_BRN_TEST_NO_LWM2M=y, so
# main.c skips lwm2m_rd_client_start. Thread mesh still attaches, NVS
# counters still persist, post_mortem snapshots still run every 5 min,
# DLMS driver still initializes (no physical RS485 on the board so
# polling is a no-op).
#
# What stays ON: Thread radio, NVS persist, post_mortem, DLMS driver
#                init, all timers and watchdogs.
# What goes OFF: LwM2M client (no REGISTER, no observe push, no
#                CoAP block-1 transfers, no periodic emits).
#
# Build:
#   west build --sysbuild -d build_brn_no_lwm2m \
#     -b xiao_esp32c6/esp32c6/hpcore <source> -- \
#     -DEXTRA_CONF_FILE="overlays/sed_aggressive.conf;overlays/brn_test_no_lwm2m.conf"

CONFIG_AMI_BRN_TEST_NO_LWM2M=y
