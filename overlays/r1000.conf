# Mesh target: UNAL-R1000 on Seeed R1000 (192.168.1.175, channel 21)
#
# Migration target. Lessons from Pi4 deployment applied from day 1:
#   - Channel 21 (clean — no rogue PAN like 0xe702 on ch25)
#   - Backbone selectivo (router thresholds 12/13)
#   - All-MED default + REED for ~10% backbone (see thread-mesh-role-assignment ADR)
#   - LwM2M lifetime ≥ 60s (see lwm2m-update-rate-and-mesh-capacity ADR)
#
# Usage (combined with med or ftd variant):
#   west build ... -- -DEXTRA_CONF_FILE="overlays/med.conf;overlays/r1000.conf"
# Or via tools/build_firmware.py:
#   python tools/build_firmware.py --variant med --mesh r1000
#
# Reference: docs/architecture/edge-r1000.md
#            (in the OpenWrt repo: docs/architecture/edge-r1000.md)

CONFIG_AMI_MESH_R1000=y

# Cosmetic Kconfig values (real dataset comes from TLV blob in main.c).
# Kept aligned so that startup banner ("Network: Thread Ch%d PAN 0x%04X")
# reports the correct values.
CONFIG_OPENTHREAD_CHANNEL=21
CONFIG_OPENTHREAD_PANID=16814
CONFIG_OPENTHREAD_NETWORK_NAME="UNAL-R1000"
CONFIG_OPENTHREAD_XPANID="b6:83:33:bc:10:1c:7c:53"
CONFIG_OPENTHREAD_NETWORKKEY="b3:1c:15:88:a1:b2:f6:8c:62:24:01:71:1f:73:af:d0"

# LwM2M server discovery: DNS-SD only (v0.6.0+).
#
# The OTBR publishes its LwM2M endpoint as a SRP service:
#   _lwm2m._udp.default.service.arpa.
# The node resolves this via otDnsClientResolveService at boot and on
# every recovery cycle. Hardcoded fallback addresses are NOT used —
# they break recovery whenever the OTBR's mleid changes (RCP swap,
# dataset reapply, partition split). See PRIO 9 / v0.6.0.

# LwM2M lifetime — overrides prj.conf default (300s).
# 120s = Update keepalive every ~96s (0.8 × 120). Faster detection of dead
# nodes than Pi 4 default while still safely below the saturation threshold.
# At lifetime=120, per_node_bps ≈ 12 bps → modelo predice >1500 nodos
# teóricos (cap topológico 32 routers domina antes que airtime).
# See: docs/decisions/lwm2m-update-rate-and-mesh-capacity.md (OpenWrt repo).
CONFIG_LWM2M_ENGINE_DEFAULT_LIFETIME=120
