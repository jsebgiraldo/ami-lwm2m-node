# Mitigation: shrink CoAP block-1 transfer size 512 -> 64 bytes.
#
# Brownout root cause (verified 2026-06-09): LwM2M Register/Update/observe
# triggers a sustained TX burst (~10 ms at 512 B/block) that draws enough
# average current to trip USB host overcurrent protection -> VBUS dropped
# instantly -> chip hard reset. With 64 B/block, each burst is ~1.2 ms
# followed by an ACK pause; the rolling average current stays under the
# host's overcurrent threshold and the chip survives the LwM2M operation.
#
# Cost: OTA + REGISTER take ~8x longer (e.g. OTA jumps from ~4 s to ~30 s
# for a 650 KB image). Telemetry pushes also stretch a bit. Acceptable
# trade for stable 24/7 operation on USB-powered SuperMini boards.
#
# Combine with sed_aggressive.conf for the full SED + low-TX + small-block
# production target.

CONFIG_LWM2M_COAP_BLOCK_SIZE=64
