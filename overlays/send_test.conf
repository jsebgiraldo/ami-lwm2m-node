# Test overlay: LwM2M 1.1 Send for guaranteed billing/PQ cadence.
#
# LwM2M Send encodes a multi-resource SenML pack — plain CBOR can't do it.
# SENML_CBOR needs ZCBOR_CANONICAL (else the Kconfig silently drops it).
# SenML CBOR is more compact than SenML JSON — better for our small CoAP block.
CONFIG_LWM2M_VERSION_1_1=y
CONFIG_AMI_LWM2M_SEND=y
CONFIG_ZCBOR_CANONICAL=y
CONFIG_LWM2M_RW_SENML_CBOR_SUPPORT=y
