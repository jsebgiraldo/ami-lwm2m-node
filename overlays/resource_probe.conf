# =============================================================================
# overlays/resource_probe.conf  —  Firmware RESOURCE diagnostics overlay
# =============================================================================
#
# PURPOSE
#   Long-uptime resource-leak / starvation hunt for the LwM2M "disconnect"
#   investigation. This overlay turns ON every cheap, always-running counter
#   that can catch a SLOW resource problem before it manifests as a dropped
#   LwM2M session:
#       * heap leak              (sys_heap free monotonically falling)
#       * stack growth/overflow  (per-thread high-water monotonically rising)
#       * thread starvation      (a thread pegged at ~100% runtime)
#       * work-queue saturation  (system_workq high-water near ceiling)
#       * mutex/deadlock          (a thread stuck PENDING forever)
#
#   It is a HARDWARE overlay: it builds for xiao_esp32c6/esp32c6/hpcore and
#   runs on the real bench boards over UART/RTT. The radio CANNOT be emulated
#   (see the report), so on-target instrumentation is the only reliable way to
#   observe these counters under the real OpenThread + LwM2M workload.
#
# USAGE  (stacks ON TOP of the production overlays — apply it LAST):
#   west build --sysbuild -p -b xiao_esp32c6/esp32c6/hpcore -d build_resprobe \
#       <app-source> -- \
#       -DEXTRA_CONF_FILE="overlays/ftd.conf;overlays/brn_fix_minimal_block256.conf;overlays/resource_probe.conf"
#
# WHAT TO WATCH (UART log, every ~30 s once attached):
#   thread_analyzer:  "<name> : STACK: unused N usage U / S (P %)"
#       - P creeping UP over hours on any thread  -> stack growth (leak/recursion)
#       - "unused 0"  or an MPU/sentinel fault    -> stack overflow (raise that
#                                                     thread's *_STACK_SIZE)
#       - any thread "(100 %)" CPU utilization     -> starvation / hot spin
#   post-mortem / Object 33000 RID 36 heap_min_free:
#       - heap_min_free FALLING boot-over-boot or within a boot -> heap leak
#         (now non-zero because SYS_HEAP_RUNTIME_STATS is enabled below)
#
# NOTE: this overlay INCREASES RAM use (~a few KB for runtime-stats bookkeeping
#       + per-thread timing) and adds log volume. It is a DIAGNOSTIC build, not
#       a fleet-production image. Remove it for the shipping build.
# =============================================================================

# --- Heap instrumentation -----------------------------------------------------
# THE key missing piece. post_mortem.c already calls
# sys_heap_runtime_stats_get(&_system_heap) but it is #if-gated on this symbol,
# so without it heap_free / heap_min_free report 0 ("stats not available").
# Enabling it makes the k_malloc/k_free system heap (CONFIG_HEAP_MEM_POOL_SIZE,
# which backs all CoAP/LwM2M/OpenThread dynamic buffers) report real free-byte
# and lifetime-minimum-free numbers — the single most direct heap-leak signal.
CONFIG_SYS_HEAP_RUNTIME_STATS=y

# Listener API for allocation/free events. Lets a heap leak be attributed to a
# growth phase if you wire a listener; harmless if unused. Cheap.
CONFIG_SYS_HEAP_LISTENER=y

# --- Per-thread runtime (CPU) statistics --------------------------------------
# Re-enables what prj.conf turned OFF in v0.6.69 (CONFIG_THREAD_RUNTIME_STATS=n)
# for RAM. For a resource hunt we WANT it: it gives THREAD_ANALYZER the CPU
# utilization % per thread so a starved/hot-spinning thread shows up as a
# pegged percentage. This is how Bug #5 (ISR0 at 100%) was originally found.
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_SCHED_THREAD_USAGE=y

# --- Thread analyzer: faster cadence + CPU column -----------------------------
# prj.conf already sets THREAD_ANALYZER + AUTO + INTERVAL=30 + USE_LOG.
# Tighten the interval for the probe build so a slow growth trend is sampled
# more often, and make sure the CPU-utilization column prints.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=20
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_PRIV_STACK_USAGE=y
CONFIG_THREAD_NAME=y
CONFIG_THREAD_STACK_INFO=y

# --- Stack-overflow detection (belt & suspenders) -----------------------------
# prj.conf already has HW_STACK_PROTECTION + STACK_SENTINEL. Add INIT_STACKS so
# the high-water-mark math is exact from boot (stacks pre-filled with a known
# pattern; thread_analyzer counts untouched bytes precisely instead of relying
# on whatever the loader left there).
CONFIG_INIT_STACKS=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y

# --- Kernel object / work-queue visibility ------------------------------------
# Object-core stats let `kernel` shell commands enumerate threads + their
# states (useful to spot a thread stuck PENDING on a mutex = deadlock).
CONFIG_OBJ_CORE=y
CONFIG_OBJ_CORE_STATS=y
# (OBJ_CORE_SYSTEM is not user-settable — it is select'd indirectly. Don't set it.)

# Shell commands to read all of the above live over UART without waiting for a
# telemetry round-trip:
#   kernel threads          -> per-thread state + stack (find a PENDING/stuck thread)
#   kernel stacks           -> stack high-water for every thread
#   ami diag / ami status   -> existing app counters incl. heap_min_free
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y

# --- Make sure logs actually leave the chip -----------------------------------
# Keep UART backend on for forensic capture (matches prj.conf v0.6.43 intent).
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
