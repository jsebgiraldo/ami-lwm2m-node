# Variant: SED AGGRESSIVE (minimum-TX SuperMini config).
#
# Last firmware-only mitigation before HW redesign. Combines:
#   - SED with 60 s poll period (12x less radio-on time than sed.conf's 5 s)
#   - TX power 0 dBm (peak current ~100 mA vs 130 mA at 4 dBm)
# Trade-offs: telemetry latency up to 60 s, mesh range smaller (must keep
# parent within ~10 m indoor).
#
# Pairs with FTD routers (XIAO ESP32-C6). One FTD parent handles ~32 SED
# children, so 1-2 XIAO + many SuperMini is fine in a benchtop fleet.
#
# Build:
#   west build --sysbuild -d build_sed_agg -b xiao_esp32c6/esp32c6/hpcore \
#     <source> -- -DEXTRA_CONF_FILE="overlays/sed_aggressive.conf;overlays/ota.conf"

# === Thread role: SED ===
CONFIG_OPENTHREAD_FTD=n
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y

# 60 s poll. AMI metering tolerates this latency; benefit is ~12x fewer
# brownout opportunities per hour.
CONFIG_OPENTHREAD_POLL_PERIOD=60000

# === MTD_SED needs IMG_MANAGER explicitly (same as med.conf) ===
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# === LwM2M Queue Mode ===
CONFIG_LWM2M_QUEUE_MODE_ENABLED=y
# Stay online 90 s after each emit, longer than queue-mode default to absorb
# any server-side delay before the radio sleeps again.
CONFIG_LWM2M_QUEUE_MODE_UPTIME=90

# === TX power: 0 dBm ===
# Drops peak current ~30 mA per TX event. Indoor range with HUB layout
# (<5 m board-to-router) is fine. Don't go below 0 dBm — see memory
# project_tx_power_minus16_caused_psu_mesh_collapse.
CONFIG_AMI_TX_POWER_DBM=0

# === LED quiet (already default, restate for explicitness) ===
# WS2812 bit-bang adds ~20 mA peak when active and adds CPU ISR jitter that
# can compete with radio TX timing. Quiet keeps the LED off unless server
# explicitly writes /3311.
CONFIG_AMI_LED_QUIET_MODE=y

# === Post-BOD TX power reduction (manual mitigation) ===
# CONFIG_ESP_PHY_REDUCE_TX_POWER is defined in the Espressif HAL but Zephyr's
# SoC layer doesn't source that Kconfig, so we can't enable it cleanly. The
# AMI_POST_BRN_REDUCE_TX symbol below triggers the same mitigation at the
# OpenThread layer: in main.c, when post_mortem detects rr=BRN at boot, we
# call otLinkSetMaxFrameRetriesDirect lower + otRadioSetTransmitPower at
# minimum (-8 dBm) for the rest of this boot, breaking the brownout cascade.
CONFIG_AMI_POST_BRN_REDUCE_TX=y

# === Thread keep-alive: extend child timeout to 30 min ===
# Default OPENTHREAD_MLE_CHILD_TIMEOUT was 240 s (4 min). Every timeout window
# the SED has to re-validate with parent (MLE Child Update). Extending to
# 1800 s = 30 min means ~7x fewer keep-alive bursts.
CONFIG_OPENTHREAD_MLE_CHILD_TIMEOUT=1800

# (OPENTHREAD_L2 log level is already pinned in prj.conf to ERR; don't
# re-assert here — the choice symbol fights with prj.conf's selection.)
