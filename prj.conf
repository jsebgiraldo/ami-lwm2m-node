# =============================================
# AMI LwM2M Node — Thread + LwM2M on ESP32-C6
# Aligned with working Windows build (no MCUboot)
# =============================================

# --- Core ---
CONFIG_LOG=y
# CONFIG_LOG_PRINTK is not set
# LOG_MODE_DEFERRED: logs are queued and output by a dedicated thread.
# Prevents all threads from blocking on USB serial poll_out (50ms/byte when no host connected).
# LOG_MODE_IMMEDIATE caused permanent deadlock after USB backpressure buildup.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BUFFER_SIZE=8192
# Pin the log-processing thread priority so a future CONFIG_NUM_PREEMPT_PRIORITIES
# change can't move it out from under the cooperative OpenThread thread (coop -8).
# poll_out (which can busy-wait when the USB host doesn't drain) runs ONLY on this
# thread; keeping it preemptible below OT guarantees it can never starve the attach.
CONFIG_LOG_PROCESS_THREAD_CUSTOM_PRIORITY=y
CONFIG_LOG_PROCESS_THREAD_PRIORITY=14
# v0.6.40: UART/USB-CDC chatter silenciado para test de production.
# Causa documentada: el chatter constante via USB-CDC en nodos conectados a hub
# añade ~10-30 mA por nodo y satura el rail del hub cuando 30 nodos transmiten
# simultáneamente. Apagamos backend UART (logs no salen pero LOG_INF/ERR siguen
# compilando), shell (no input parser) y UART_CONSOLE. Para volver a build de
# debug, revertir estas 3 líneas.
CONFIG_LOG_BACKEND_UART=y  # v0.6.43: re-enabled for forensic capture
CONFIG_LOG_RUNTIME_FILTERING=y
# v0.6.46 Layer 2 — defense in depth against cbprintf_package_convert crash
# (Zephyr #57867 + #83671, WONTFIX upstream). Pairs with the bounded %.*s
# fixes in dlms_meter.c / main.c / lwm2m_obj_thread_cli.c.
#
# Bigger log thread stack: cbprintf_package_convert recurses while walking
# args; on stack-tight builds the recursion blows the log thread's stack
# silently, leading to spurious faults elsewhere. 4 KiB is comfortable.
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
# Continuous per-thread high-water-mark reporting. Lets QA flag boards whose
# threads sit too close to their stack ceiling BEFORE they crash in prod.
# AUTO=y spawns a low-priority thread that logs stats every ~5 s.
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=30
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_STACK_INFO=y
# v0.6.69 RAM optimization (Tier 2): RUNTIME_STATS off.
# THREAD_ANALYZER (kept) tracks stack high-water marks — that's what we
# need for fleet QA. RUNTIME_STATS tracks CPU time per thread which is
# a profiling feature we don't ship. Saves ~per-thread overhead.
CONFIG_THREAD_RUNTIME_STATS=n
# MPU-backed guard page after every thread stack. Stack overflow becomes a
# deterministic memory-protection fault (with PC pointing at the offender)
# instead of silent corruption that surfaces minutes later as a wild jump.
CONFIG_HW_STACK_PROTECTION=y
# Canary word at the bottom of every stack, checked on every context switch.
# Belt-and-suspenders with HW_STACK_PROTECTION above for the few edge cases
# the MPU doesn't catch (e.g. a slow walk-off that doesn't touch the guard
# page but does touch the canary).
CONFIG_STACK_SENTINEL=y
# v0.6.48 Bug #5 root cause fix: with default 2048B, THREAD_ANALYZER showed
# ISR0 at 100% (2048/2048, 0 unused) on both MTD and FTD nodes during normal
# operation -- next nested radio interrupt would corrupt RAM above the ISR
# stack, manifesting as random "cbprintf_package_convert" or "settings_load"
# crashes (Bug #5 trace).
# v0.6.56: bumped from 4096 -> 8192. v0.6.55 serial capture still showed
# ISR0 at 100% (4096/4096), so 4096 was still under-sized for the worst-case
# 802.15.4 burst. 8192 gives ~50% headroom over the observed peak; cost is
# ~4 KB RAM.
CONFIG_ISR_STACK_SIZE=8192
# Companion bump: ot_radio_workq at 67-95% on observed nodes -- the workqueue
# that processes 802.15.4 events also runs tight. Default is 512.
# v0.6.64: 1024 -> 2048 for 30-node scale headroom. At 7 boards peak is
# 42% (440/1024). Routers in 30-node mesh forward ~6 children worth of
# traffic each, so 30-node peak projects to ~170% of 7-board peak.
CONFIG_OPENTHREAD_RADIO_WORKQUEUE_STACK_SIZE=2048
CONFIG_EARLY_CONSOLE=y
CONFIG_BOOT_BANNER=y
CONFIG_GPIO=y
# v0.6.54: REVERTED LED_STRIP + SPI from v0.6.53 -- enabling CONFIG_SPI broke
# the 802.15.4 radio attach on all 30 nodes (mesh dropped to 0 routers during
# 1h soak). Restored custom rgb_led.c bit-bang driver. LED visual remains
# the v0.6.46 behaviour (some stuck-colour residual) but production deployment
# survives. Don't re-enable LED_STRIP without isolating the radio conflict.
CONFIG_STREAM_FLASH=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_IMG_MANAGER=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y  # v0.6.43: re-enabled for forensic capture
# v0.6.62: bumped from 4096 -> 8192. Lab 1 panic stack analysis showed main
# thread overflows during cbprintf_package_convert recursion in
# net_config_init_by_iface path. The recursive cbprintf can spike well past
# the 69% steady-state observed in thread_analyzer. 8192 gives headroom.
CONFIG_MAIN_STACK_SIZE=8192
# v0.6.62: reduce verbose net_config logging to keep cbprintf load down. The
# default log level produces NET_DBG messages with non-trivial %s args during
# IPv6 / Thread init that exercise the cbprintf recursion path the most.
CONFIG_NET_CONFIG_LOG_LEVEL_ERR=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# v0.6.69 RAM optimization (Tier 1): 98304 → 65536 (32 KB savings).
# Heap aloja CoAP buffers, OT mesh state, settings strings dynamic. With
# the v0.6.69 LwM2M pool reductions below, peak in-flight allocation drops.
# Validate post-deploy with post-mortem heap_min_free RID: target ≥16 KB
# floor. If margin tight, bump back to 81920 (still saves 16 KB vs 98).
CONFIG_HEAP_MEM_POOL_SIZE=65536
# BOOT_DELAY: solo útil para conectar monitor antes del banner. En producción
# costa 4s extra al boot watchdog presupuesto y al user experience. Lo dejo
# en 0 ahora que tenemos shell input funcional via INTERRUPT_DRIVEN.
CONFIG_BOOT_DELAY=0
CONFIG_REBOOT=y

# --- Networking ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""

# IPv6 buffer sizing
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=8
# v0.6.64: bumped PKT 32->64, BUF 64->128 for 30-node burst tolerance.
# 30 boards simultaneously registering / sending observe responses generates
# burst queues that exhaust the 32-PKT pool. ~6 KB RAM cost total.
# v0.6.69 RAM optimization (Tier 1): TX halved (RX kept full for storm).
# Each board mostly sends — TX rarely saturates. RX still gets 30-node
# burst (all neighbours retransmitting routing messages at once). ~3 KB
# net savings on TX side.
CONFIG_NET_PKT_RX_COUNT=64
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=6

# ARP (only needed for IPv4/Ethernet — disabled when WiFi off)
#CONFIG_NET_ARP=y

CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=8

# --- OpenThread ---
# Device type (FTD vs MTD/MED) is selected per-build via overlay:
#   west build ... -- -DEXTRA_CONF_FILE=overlays/med.conf  (default fleet role)
#   west build ... -- -DEXTRA_CONF_FILE=overlays/ftd.conf  (router-eligible)
# tools/build_firmware.py --variant {med|ftd} encapsulates this.
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_4=y

# Thread Network Credentials (must match OTBR — UNAL-Thread)
CONFIG_OPENTHREAD_CHANNEL=25
CONFIG_OPENTHREAD_PANID=9197
CONFIG_OPENTHREAD_NETWORKKEY="5e:de:be:ad:64:40:5b:3e:17:19:36:46:c2:94:22:85"
CONFIG_OPENTHREAD_NETWORK_NAME="UNAL-Thread"
CONFIG_OPENTHREAD_XPANID="1a:25:78:dd:6e:e3:57:3b"

# OpenThread features
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_DNS_CLIENT=y
CONFIG_OPENTHREAD_SLAAC=y
# v0.6.69 RAM optimization (Tier 1): unused subsystems disabled.
# - DHCP6_CLIENT: Thread mesh uses SLAAC for addressing. Verified no
#   otDhcp6 call in src/ — safe to drop, saves ~2 KB.
# - SNTP_CLIENT: no time sync code uses it (no otSntp* refs in src/).
#   uptime_s from k_uptime_get is the only time source we use, saves ~3 KB.
# - DIAG: OpenThread diagnostic commands. Useful in lab, not production.
#   Saves ~2 KB. Re-enable in debug builds via overlay if needed.
CONFIG_OPENTHREAD_DHCP6_CLIENT=n
CONFIG_OPENTHREAD_SNTP_CLIENT=n
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_DIAG=n
# COMMISSIONER removed — not needed on end devices

# v0.6.59: REVERTED v0.6.57 OT tunings (PARENT_SEARCH + JITTER_OVERRIDE).
# v0.6.57 caused silent boot on lab 31, 32 (new boards 58:e6:c5:18:cc:*).
# Either the configs triggered an early-boot panic or interacted badly with
# the new board's radio. Rolled back; reverify boot works first, then re-add
# one knob at a time to identify the culprit.

# OpenThread logging (production: WRN level)
CONFIG_OPENTHREAD_DEBUG=n
CONFIG_OPENTHREAD_L2_DEBUG=n
CONFIG_OPENTHREAD_L2_LOG_LEVEL_WRN=y

# --- NVS for OpenThread credentials persistence ---
# v0.6.46: cache mitigations for the recurring CPU-exception crash inside
# settings_load_subtree_direct -> ot_setting_read_cb -> cbprintf_package_convert
# observed during board_acceptance.py soak on multiple nodes. Reducing the
# frequency of NVS scans makes the timing window for the underlying race much
# narrower. RAM cost ~1-2 KB total. Cache size 32 matches typical OT settings
# count (~20 entries: dataset+keys+counters+addresses).
CONFIG_NVS=y
CONFIG_NVS_LOOKUP_CACHE=y
CONFIG_NVS_LOOKUP_CACHE_SIZE=128
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_NAME_CACHE=y
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=32
CONFIG_OPENTHREAD_SETTINGS_RAM=n

# --- HWINFO for reset cause tracking (PRIO 7, v0.6.1+) ---
CONFIG_HWINFO=y

# --- Hardware Watchdog (v0.6.13+, PRIO 9) ---
# Last-resort defense: if the soft LwM2M watchdog (lwm2m_watchdog.c) cannot
# recover from a hang because system_workq is wedged or the kernel scheduler
# is stuck (observed in 14c8: USB CDC TX died, engine became unrecoverable
# without external reset), the HW WDT fires SYS_RESET unconditionally.
#
# Two task_wdt channels:
#   * kernel-alive : fed from a dedicated K_PRIO_PREEMPT(4) thread
#   * workq-alive  : fed from a self-rescheduling delayed_work on system_workq
# Either silent for AMI_HW_WATCHDOG_TIMEOUT_S → cold reboot.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=10000
CONFIG_TASK_WDT_CHANNELS=4
# v0.6.46: bump HW WDT timeout 180->300s to tolerate the transient
# settings_load hang observed in QA soaks. The underlying CPU-exception
# crash is upstream in Zephyr/OpenThread; lengthening the watchdog window
# avoids spurious cold reboots when the hang clears on its own.
CONFIG_AMI_HW_WATCHDOG_TIMEOUT_S=300
# v0.6.61: 90s default too tight for RF-marginal nodes (DNS-SD timeout=70s
# alone if Thread attach takes >20s). 180s gives slow nodes room for full
# attach + DNS-SD + first REGISTER without falsely flagging a hang.
CONFIG_AMI_BOOT_REGISTER_DEADLINE_S=180

# --- ESP32-C6 on-die temperature sensor (v0.6.11+) ---
# Enables thermal monitoring of the SoC. Read via the Zephyr sensor API.
CONFIG_SENSOR=y
CONFIG_ESP32_TEMP=y

# --- IPSO Object 3303 Temperature Sensor (v0.6.12+) ---
# Standard LwM2M temperature object so TB Edge can monitor remotely
# without custom Object 33000 RIDs. Single instance (the SoC die).
CONFIG_LWM2M_IPSO_SUPPORT=y    # master enable for any IPSO object
CONFIG_LWM2M_IPSO_TEMP_SENSOR=y
CONFIG_LWM2M_IPSO_TEMP_SENSOR_INSTANCE_COUNT=1
CONFIG_LWM2M_IPSO_TEMP_SENSOR_VERSION_1_1=y

# --- IPSO Object 3311 Light Control (v0.6.35+) ---
# Server-controlled RGB LED. Zephyr provides the object/resource scaffolding;
# src/lwm2m_obj_light_control.c registers post-write callbacks for /5850
# (On/Off), /5851 (Dimmer 0..100), /5706 (Colour string "#RRGGBB" or name).
# Writes go through ami_led_set_raw() so they share the WS2812 mutex (v0.6.32).
CONFIG_LWM2M_IPSO_LIGHT_CONTROL=y
CONFIG_LWM2M_IPSO_LIGHT_CONTROL_INSTANCE_COUNT=1

# --- Shell (for debug) ---
CONFIG_SHELL=y  # v0.6.43: re-enabled for forensic capture
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
# Shell backend reverted to POLLING in v0.6.10 — INTERRUPT_DRIVEN broke
# boot path on multi-node mass-attach scenarios (3/4 nodes failed to register
# after parallel flash). POLLING is safer with USB CDC-ACM and avoids the
# shell thread deadlock observed in v0.6.7-v0.6.9. Trade-off: shell input
# is unreliable in production — the operator-facing TX path also has its
# own Windows USB driver issue that prevents reliable input even with
# INTERRUPT_DRIVEN, so we lose nothing by reverting.
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
# Disable shell log backend — LOG_MODE_IMMEDIATE + shell log backend
# causes crash (mutex called before shell thread init).
# All logs go through LOG_BACKEND_UART (direct uart_poll_out) instead.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_OPENTHREAD_SHELL=y

# --- LwM2M ---
CONFIG_LWM2M=y
CONFIG_LWM2M_LOG_LEVEL_INF=y
CONFIG_LWM2M_COAP_BLOCK_SIZE=512
# v0.6.44: profile observe-list grew to 40 paths (was 22; +18 added by
# tb_edge_monitoring_setup.py OBSERVE_ADDITIONS on 2026-05-27 to unfreeze
# uptime_s / notify_emitted / energies / 3P totals). MAX_OBSERVER=24 caused
# TB Edge's Observe push to silently fail for ~16 paths/node — visible as
# resources stuck at registration-time timestamp while other paths on the
# same node advanced normally. Raised to 48 so all current paths fit with
# headroom for future diagnostics. The companion engine buffers (messages,
# pending, replies, numerical-tracking) scale together — each new Observe
# can have an in-flight CoAP message + pending ACK + reply slot, and every
# numerical resource needs a tracking slot for change-detection.
# v0.6.69 RAM optimization (Tier 1+2): pools right-sized after audit.
# MAX_OBSERVER 48 → 36: tb_edge_setup OBSERVE_ADDITIONS has ~35 entries +
# the standard /3/0/* paths; 36 fits with 1-slot headroom. MAX_PENDING /
# REPLIES 48 → 32: in-flight CoAP transactions rarely exceed ~24 (engine
# pmin/pmax throttling). MAX_MESSAGES + NUMERICAL_TRACKED stay at 48 to
# keep notify queue headroom for the post-register storm.
CONFIG_LWM2M_ENGINE_MAX_OBSERVER=36
CONFIG_LWM2M_MAX_NOTIFIED_NUMERICAL_RES_TRACKED=48
CONFIG_LWM2M_ENGINE_MAX_MESSAGES=48
CONFIG_LWM2M_ENGINE_MAX_PENDING=32
CONFIG_LWM2M_ENGINE_MAX_REPLIES=32
CONFIG_LWM2M_RD_CLIENT_MAX_RETRIES=10
CONFIG_COAP_MAX_RETRANSMIT=6
# v0.6.45: stack size bumped 8192 -> 16384. v0.6.44 induced a crash loop on
# all USB nodes (last_reset_reason=2 SOFTWARE = Zephyr panic, total_resets
# climbing every ~30 s on freshly-booted nodes). The engine handles the post-
# Registration Observe burst on a single dedicated thread; with 40 paths to
# install + CBOR/TLV encode + CoAP build for each, ~1 KB stack per callback,
# the old 8 KB ran out during the boot-time storm. Stack overflow on the
# engine thread blew up the LwM2M ctx and Zephyr panicked. 16 KB gives plenty
# of headroom and only costs ~8 KB of static RAM (still <80 % sram0 use).
# Keep this in mind when expanding the observe list further.
CONFIG_LWM2M_ENGINE_STACK_SIZE=16384
# v0.6.41: TX power al mínimo de la Kconfig para mitigar brownouts en
# nodos USB-hub-powered. Historial: 4 dBm (default) -> 0 dBm probado en
# v0.6.23 causó 1141 TxDirectMaxRetryExpiry sobre 30 nodos lejanos al BR.
# Ahora con todos cerca al OTBR (testimonio del usuario), -16 dBm (25 µW,
# 100x menos potencia que 4 dBm) reduce el pico de corriente del PA y
# debería seguir alcanzando al BR. Si TxDirectMaxRetryExpiry sube mucho
# en la telemetría, revertir a 0 o -3 dBm como middle ground.
# v0.6.60: bumped from -16 dBm (25 microwatts, minimum) -> 4 dBm (2.5 mW).
# -16 was traced as root cause of PSU mesh collapse 30/30 -> 3%: at 25 uW
# the radio reaches only ~5 m indoor, and a 30-board cluster on PSU has nodes
# further than that from the OTBR. With 4 dBm (Kconfig default) the range
# becomes ~30 m indoor which comfortably covers the rack. Self-heating cost
# at 4 dBm is bounded -- the v0.6.34 thermal investigation showed +3 dBm
# adds ~25 mA TX current, but TX duty cycle on LwM2M nodes is <1% so the
# steady-state temperature impact is negligible (~+1 deg C).
CONFIG_AMI_TX_POWER_DBM=4
# v0.6.66: lifetime 300 -> 86400 (24h). TB Edge has a bug where it only
# refreshes lastActivityTime on REGISTER, not REG_UPDATE — meaning at
# T=lifetime the device gets marked "disconnected" server-side even though
# CoAP is still flowing, breaking every server->client RPC (Read/Write/
# Execute/Observe) with HTTP 504. With lifetime=86400 the client stays
# "connected" in TB Edge's view for a full day at a time, unlocking
# Object 33001 dynamic management (router_upgrade/downgrade thresholds,
# become_router/child execute) and any future write-based operations.
# Tradeoff: dead-device detection latency rises from ~5 min to ~24 h.
# That's acceptable because the conn-monitor's lwm2m_notify_emitted counter
# arrives over Observe every minute and gives a server-side liveness proxy.
CONFIG_LWM2M_ENGINE_DEFAULT_LIFETIME=86400
# v0.6.66: bumped from 30 to 17280 (20% of 86400). With lifetime=24h, the
# default 30 s would fire REG_UPDATE only 30 s before the server expires the
# registration — one missed packet (mesh hiccup) means a 24-h outage until
# the next REGISTER. 17280 s = 4.8 h cushion: REG_UPDATE fires at ~19.2 h
# uptime, giving plenty of retry budget before the server-side lifetime ends.
CONFIG_LWM2M_SECONDS_TO_UPDATE_EARLY=17280
# v0.7.5 — BUG #2 FIX (HW real-liveness watchdog starvation).
# The HW watchdog "real-liveness gate" (hw_watchdog.c) cold-reboots the SoC if no
# server-ACKed REGISTRATION/REG_UPDATE_COMPLETE arrives within
# CONFIG_AMI_REAL_LIVENESS_TIMEOUT_S (600 s). With lifetime=86400 the engine
# otherwise sends REG_UPDATE only every ~19 h (lifetime - UPDATE_EARLY), so the
# gate starved and rebooted every ~700 s (= ~45 s register + 600 s timeout),
# bypassing ami_reboot_drain -> reset_reason=SW, last_reboot_code=0. Caught via
# Object 33000 RID 37. Forcing UPDATE_PERIOD=300 makes the engine emit a genuine
# server-ACKed REG_UPDATE every 300 s (next_update = MIN(300, lifetime-early)),
# feeding BOTH the HW liveness gate and the silence watchdog with 2x margin,
# WITHOUT lowering the lifetime (so TB Edge RPC keeps working). Cost: one small
# CoAP UPDATE per board per 5 min.
CONFIG_LWM2M_UPDATE_PERIOD=300
# v0.6.69 RAM optimization (Tier 1): LwM2M shell commands removed.
# The 'ami' custom shell commands cover the diagnostic surface we use
# in production (status, diag, obis, reset). Zephyr's lwm2m shell adds
# Read/Write/Execute interactive commands that nobody types in field.
# Saves ~3 KB code + some RAM. Re-enable in debug overlay if needed.
CONFIG_LWM2M_SHELL=n

# Custom Object 10242 (3-Phase Power Meter) — no IPSO needed

# Object 4 (Connectivity Monitoring) — populated with Thread data
# MUST be version 1.3 to match TB Edge profile path /4_1.3/0/x
CONFIG_LWM2M_CONN_MON_OBJ_SUPPORT=y
CONFIG_LWM2M_CONNMON_OBJECT_VERSION_1_3=y
CONFIG_LWM2M_CONN_MON_BEARER_MAX=1
# Allow up to 4 IPv6 addresses on the Thread interface (CONNMON_IP_ADDRESS_MAX)
CONFIG_NET_IF_MAX_IPV6_COUNT=4

# LwM2M Server address — discovered at runtime via OpenThread DNS-SD
# resolution of "ThingsBoard-Edge._lwm2m._udp.default.service.arpa." or
# "thingsboard-edge.default.service.arpa." served by the OTBR SRP server.
#
# v0.6.65: removed CONFIG_AMI_LWM2M_SERVER_IPV6_PRIMARY/_SECONDARY entirely.
# After the 2026-06-04 incident where a stale fallback IP masked a server-side
# routing bug for hours (boards fell through to dead address, watchdog
# cold-rebooted, no useful diagnostic), the system is now pure DNS-SD: if SRP
# discovery fails after CONFIG_AMI_LWM2M_DNS_SD_RETRY_MAX attempts, the
# recover_work cycle backs off and retries SRP instead of forwarding to a
# hardcoded address. See docs/DYNAMIC_DISCOVERY.md.
CONFIG_NET_CONFIG_PEER_IPV6_ADDR=""

# CoAP
CONFIG_COAP_INIT_ACK_TIMEOUT_MS=5000
CONFIG_COAP_MAX_RETRANSMIT=6
CONFIG_COAP_EXTENDED_OPTIONS_LEN=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=40

# --- CoAP diag GET server: object-independent IPv6 diagnostics (src/coap_diag.c)
# A tiny CoAP server on [::]:5685/diag answers a GET with a JSON status snapshot
# straight over the node's Thread IPv6 address, INDEPENDENT of the LwM2M session.
# Lets the server poll a node that is still on the mesh but has dropped off TB.
CONFIG_COAP_SERVER=y
# The server runs its own thread and opens +1 UDP socket (its eventfd is already
# auto-reserved via ZVFS_OPEN_ADD_SIZE_EVENTFD). Give the fd pool clear headroom.
CONFIG_ZVFS_OPEN_MAX=16
# /ami returns the full live metering snapshot (~380 B JSON); raise the server
# message size so it fits in a single (non-block-wise) response. 512 >= the
# default 256 block size, so block-wise transfers are unaffected.
CONFIG_COAP_SERVER_MESSAGE_SIZE=512

# --- mbedTLS (required by OpenThread) ---
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=768

# --- ESP32-C6 specific ---
CONFIG_BT=n
CONFIG_SERIAL_ESP32_USB=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# CONFIG_UART_LINE_CTRL is not set (serial_esp32_usb.c has no line_ctrl impl — causes DTR=0 forever, blocking all shell output)
CONFIG_BOOTLOADER_REGION_PROTECTION_ENABLE=n

# --- v0.6.69 Power / Brownout resilience (audit P2) ---
# NOTE 2026-06-06: ESP_BROWNOUT_DET_LVL_SEL_3 and SPI_FLASH_BROWNOUT_RESET
# are defined in this Zephyr's espressif HAL Kconfig (verified in
# modules/hal/espressif/components/esp_system/port/soc/esp32c6/Kconfig.system)
# but the Kconfig parser rejects them as undefined when set from prj.conf,
# likely because the SoC selection path that pulls in the HAL Kconfig
# isn't resolved at the time prj.conf is parsed. Defaults stay at LVL_7
# (2.51 V) with no SPI flash brownout reset. Revisit when migrating to a
# newer Zephyr or with -DEXTRA_KCONFIG_OPTIONS_FILE=... via west args.

# --- RS485 / DLMS Meter ---
# UART1 used for RS485 half-duplex (9600 8N1)
# DE/RE pin on GPIO2 controlled via GPIO driver
# See boards/xiao_esp32c6_hpcore.overlay for devicetree config

# --- Entropy ---
CONFIG_ENTROPY_GENERATOR=y

# --- Debug extras ---
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_FAULT_DUMP=2
# v0.6.69 RAM optimization (Tier 2): EXTRA_EXCEPTION_INFO off.
# post_mortem.c captures uptime/heap/state at last hang and we expose them
# via Object 33000 RIDs 23-28 — that's the production forensic path. The
# extra exception info adds ~1-2 KB of dump metadata that only helps if
# the operator is staring at a UART console at the moment of fault.
CONFIG_EXTRA_EXCEPTION_INFO=n
CONFIG_IEEE802154_DRIVER_LOG_LEVEL_WRN=y
# v0.6.69 RAM optimization (Tier 2): NET_LOG off + OT L2 ERR-only.
# Production builds run in PSU cabinets without console attached. The
# only consumer of net/OT logs was lab debugging. Saves ~3 KB of log
# strings + reduces cbprintf load (one of the recurring crash patterns).
CONFIG_NET_LOG=n
CONFIG_OPENTHREAD_L2_LOG_LEVEL_ERR=y

# --- Floating point printf ---
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Kernel safety for single-core ---
CONFIG_SPIN_VALIDATE=n

# --- AMI Application ---
CONFIG_AMI_SINGLE_PHASE=y
CONFIG_AMI_DEMO_MODE=y

# v0.6.71 BENCH OVERRIDE — sustained-confirm window lowered for the
# brownout-prone PSU bench. Production deployments should remove this
# override so the Kconfig default (600 s = 10 min) applies, giving stronger
# evidence of sustained health before committing the new image as permanent.
# At 60 s, an OTA that boots and survives one keepalive cycle gets confirmed
# even if it later crashes — acceptable for bench testing where MCUboot
# rollback is preventing us from validating the firmware at all.
CONFIG_AMI_OTA_CONFIRM_DELAY_S=60
