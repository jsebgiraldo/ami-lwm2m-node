# =============================================
# AMI LwM2M Node — Thread + LwM2M on ESP32-C6
# Aligned with working Windows build (no MCUboot)
# =============================================

# --- Core ---
CONFIG_LOG=y
# CONFIG_LOG_PRINTK is not set
# LOG_MODE_DEFERRED: logs are queued and output by a dedicated thread.
# Prevents all threads from blocking on USB serial poll_out (50ms/byte when no host connected).
# LOG_MODE_IMMEDIATE caused permanent deadlock after USB backpressure buildup.
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PROCESS_THREAD_SLEEP_MS=10
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_EARLY_CONSOLE=y
CONFIG_BOOT_BANNER=y
CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=98304
# BOOT_DELAY: solo útil para conectar monitor antes del banner. En producción
# costa 4s extra al boot watchdog presupuesto y al user experience. Lo dejo
# en 0 ahora que tenemos shell input funcional via INTERRUPT_DRIVEN.
CONFIG_BOOT_DELAY=0
CONFIG_REBOOT=y

# --- Networking ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_TCP=n
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV6=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_NEED_IPV4=n
CONFIG_NET_CONFIG_MY_IPV4_ADDR=""
CONFIG_NET_CONFIG_PEER_IPV4_ADDR=""

# IPv6 buffer sizing
CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=6
CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=8
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=6

# ARP (only needed for IPv4/Ethernet — disabled when WiFi off)
#CONFIG_NET_ARP=y

CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=8

# --- OpenThread ---
# Device type (FTD vs MTD/MED) is selected per-build via overlay:
#   west build ... -- -DEXTRA_CONF_FILE=overlays/med.conf  (default fleet role)
#   west build ... -- -DEXTRA_CONF_FILE=overlays/ftd.conf  (router-eligible)
# tools/build_firmware.py --variant {med|ftd} encapsulates this.
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_4=y

# Thread Network Credentials (must match OTBR — UNAL-Thread)
CONFIG_OPENTHREAD_CHANNEL=25
CONFIG_OPENTHREAD_PANID=9197
CONFIG_OPENTHREAD_NETWORKKEY="5e:de:be:ad:64:40:5b:3e:17:19:36:46:c2:94:22:85"
CONFIG_OPENTHREAD_NETWORK_NAME="UNAL-Thread"
CONFIG_OPENTHREAD_XPANID="1a:25:78:dd:6e:e3:57:3b"

# OpenThread features
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_DNS_CLIENT=y
CONFIG_OPENTHREAD_SLAAC=y
CONFIG_OPENTHREAD_DHCP6_CLIENT=y
CONFIG_OPENTHREAD_SNTP_CLIENT=y
CONFIG_OPENTHREAD_SHELL=y
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_DIAG=y
# COMMISSIONER removed — not needed on end devices

# OpenThread logging (production: WRN level)
CONFIG_OPENTHREAD_DEBUG=n
CONFIG_OPENTHREAD_L2_DEBUG=n
CONFIG_OPENTHREAD_L2_LOG_LEVEL_WRN=y

# --- NVS for OpenThread credentials persistence ---
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_OPENTHREAD_SETTINGS_RAM=n

# --- HWINFO for reset cause tracking (PRIO 7, v0.6.1+) ---
CONFIG_HWINFO=y

# --- Hardware Watchdog (v0.6.13+, PRIO 9) ---
# Last-resort defense: if the soft LwM2M watchdog (lwm2m_watchdog.c) cannot
# recover from a hang because system_workq is wedged or the kernel scheduler
# is stuck (observed in 14c8: USB CDC TX died, engine became unrecoverable
# without external reset), the HW WDT fires SYS_RESET unconditionally.
#
# Two task_wdt channels:
#   * kernel-alive : fed from a dedicated K_PRIO_PREEMPT(4) thread
#   * workq-alive  : fed from a self-rescheduling delayed_work on system_workq
# Either silent for AMI_HW_WATCHDOG_TIMEOUT_S → cold reboot.
CONFIG_WATCHDOG=y
CONFIG_TASK_WDT=y
CONFIG_TASK_WDT_HW_FALLBACK=y
CONFIG_TASK_WDT_MIN_TIMEOUT=1000
CONFIG_TASK_WDT_HW_FALLBACK_DELAY=10000
CONFIG_TASK_WDT_CHANNELS=4

# --- ESP32-C6 on-die temperature sensor (v0.6.11+) ---
# Enables thermal monitoring of the SoC. Read via the Zephyr sensor API.
CONFIG_SENSOR=y
CONFIG_ESP32_TEMP=y

# --- IPSO Object 3303 Temperature Sensor (v0.6.12+) ---
# Standard LwM2M temperature object so TB Edge can monitor remotely
# without custom Object 33000 RIDs. Single instance (the SoC die).
CONFIG_LWM2M_IPSO_SUPPORT=y    # master enable for any IPSO object
CONFIG_LWM2M_IPSO_TEMP_SENSOR=y
CONFIG_LWM2M_IPSO_TEMP_SENSOR_INSTANCE_COUNT=1
CONFIG_LWM2M_IPSO_TEMP_SENSOR_VERSION_1_1=y

# --- Shell (for debug) ---
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_CMD_BUFF_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
# Shell backend reverted to POLLING in v0.6.10 — INTERRUPT_DRIVEN broke
# boot path on multi-node mass-attach scenarios (3/4 nodes failed to register
# after parallel flash). POLLING is safer with USB CDC-ACM and avoids the
# shell thread deadlock observed in v0.6.7-v0.6.9. Trade-off: shell input
# is unreliable in production — the operator-facing TX path also has its
# own Windows USB driver issue that prevents reliable input even with
# INTERRUPT_DRIVEN, so we lose nothing by reverting.
CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
# Disable shell log backend — LOG_MODE_IMMEDIATE + shell log backend
# causes crash (mutex called before shell thread init).
# All logs go through LOG_BACKEND_UART (direct uart_poll_out) instead.
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_OPENTHREAD_SHELL=y

# --- LwM2M ---
CONFIG_LWM2M=y
CONFIG_LWM2M_LOG_LEVEL_INF=y
CONFIG_LWM2M_COAP_BLOCK_SIZE=512
CONFIG_LWM2M_ENGINE_MAX_OBSERVER=24
CONFIG_LWM2M_MAX_NOTIFIED_NUMERICAL_RES_TRACKED=32
CONFIG_LWM2M_ENGINE_MAX_MESSAGES=24
CONFIG_LWM2M_ENGINE_MAX_PENDING=24
CONFIG_LWM2M_ENGINE_MAX_REPLIES=24
CONFIG_LWM2M_RD_CLIENT_MAX_RETRIES=10
CONFIG_COAP_MAX_RETRANSMIT=6
CONFIG_LWM2M_ENGINE_STACK_SIZE=8192
CONFIG_LWM2M_ENGINE_DEFAULT_LIFETIME=300
CONFIG_LWM2M_SECONDS_TO_UPDATE_EARLY=30
CONFIG_LWM2M_SHELL=y

# Custom Object 10242 (3-Phase Power Meter) — no IPSO needed

# Object 4 (Connectivity Monitoring) — populated with Thread data
# MUST be version 1.3 to match TB Edge profile path /4_1.3/0/x
CONFIG_LWM2M_CONN_MON_OBJ_SUPPORT=y
CONFIG_LWM2M_CONNMON_OBJECT_VERSION_1_3=y
CONFIG_LWM2M_CONN_MON_BEARER_MAX=1
# Allow up to 4 IPv6 addresses on the Thread interface (CONNMON_IP_ADDRESS_MAX)
CONFIG_NET_IF_MAX_IPV6_COUNT=4

# LwM2M Server address — discovered at runtime via OpenThread DNS-SD
# resolution of "ThingsBoard-Edge._lwm2m._udp.default.service.arpa." or
# "thingsboard-edge.default.service.arpa." served by the OTBR SRP server.
# Values below are only used as compile-time fallback when DNS-SD discovery
# fails. The current default is the OTBR Mesh-Local EID at 192.168.1.111.
CONFIG_NET_CONFIG_PEER_IPV6_ADDR="fdf5:bffd:bd6:ef74:eb7b:f1d1:874e:2b91"
CONFIG_AMI_LWM2M_SERVER_IPV6_PRIMARY="fdf5:bffd:bd6:ef74:eb7b:f1d1:874e:2b91"
CONFIG_AMI_LWM2M_SERVER_IPV6_SECONDARY=""

# CoAP
CONFIG_COAP_INIT_ACK_TIMEOUT_MS=5000
CONFIG_COAP_MAX_RETRANSMIT=6
CONFIG_COAP_EXTENDED_OPTIONS_LEN=y
CONFIG_COAP_EXTENDED_OPTIONS_LEN_VALUE=40

# --- mbedTLS (required by OpenThread) ---
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=768

# --- ESP32-C6 specific ---
CONFIG_BT=n
CONFIG_SERIAL_ESP32_USB=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# CONFIG_UART_LINE_CTRL is not set (serial_esp32_usb.c has no line_ctrl impl — causes DTR=0 forever, blocking all shell output)
CONFIG_BOOTLOADER_REGION_PROTECTION_ENABLE=n

# --- RS485 / DLMS Meter ---
# UART1 used for RS485 half-duplex (9600 8N1)
# DE/RE pin on GPIO2 controlled via GPIO driver
# See boards/xiao_esp32c6_hpcore.overlay for devicetree config

# --- Entropy ---
CONFIG_ENTROPY_GENERATOR=y

# --- Debug extras ---
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_FAULT_DUMP=2
CONFIG_EXTRA_EXCEPTION_INFO=y
CONFIG_IEEE802154_DRIVER_LOG_LEVEL_WRN=y
CONFIG_NET_LOG=y
CONFIG_OPENTHREAD_L2_LOG_LEVEL_WRN=y

# --- Floating point printf ---
CONFIG_CBPRINTF_FP_SUPPORT=y

# --- Kernel safety for single-core ---
CONFIG_SPIN_VALIDATE=n

# --- AMI Application ---
CONFIG_AMI_SINGLE_PHASE=y
CONFIG_AMI_DEMO_MODE=y
