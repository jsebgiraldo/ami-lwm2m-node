# =============================================
# AMI 802.15.4 Sniffer — ESP32-C6 DevKit
# Passive promiscuous capture, raw frames over the console UART.
# Companion host tool: tools/sniffer_capture.py
# =============================================

# --- Console (CH343 hw UART bridge on the DevKit, 1 Mbaud — see app.overlay) ---
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_GPIO=y

# --- Networking: ONLY the IEEE 802.15.4 radio in RAW mode ---
# RAW_MODE makes the L2 a pass-through: the driver hands every received
# frame straight to net_recv_data(), which we override in main.c. No IP,
# no L2 addressing, no filtering beyond what we disable via promiscuous.
CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_IEEE802154_RAW_MODE=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=n
CONFIG_NET_CONFIG_AUTO_INIT=n

# --- RX buffering: headroom so frame bursts don't starve the radio ---
# The output thread drains the FIFO; if it falls behind, the driver drops
# new frames gracefully instead of blocking the RX path.
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=24
CONFIG_NET_BUF_TX_COUNT=4
CONFIG_NET_BUF_DATA_SIZE=128

# --- Logging: errors only — must not pollute the capture stream ---
# The host tool ignores any line not starting with '$' or '#', but keeping
# log noise minimal avoids UART contention with the frame output.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=1
CONFIG_IEEE802154_DRIVER_LOG_LEVEL_ERR=y

# --- Kernel ---
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ENTROPY_GENERATOR=y
