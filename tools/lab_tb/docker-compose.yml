# ThingsBoard CE — BENCH LwM2M server for the LAB Thread mesh (WSL2 / Ubuntu-24.04)
#
# WHY THIS FILE EXISTS
#   The node discovers its LwM2M server ONLY via DNS-SD over Thread
#   (src/lwm2m_discover.c) and then REGISTERs to it. With no server on the bench
#   the node never registers, so overlays/lab.conf has to disable the
#   boot-register deadline (CONFIG_AMI_BOOT_REGISTER_DEADLINE_S=0) and stretch
#   the HW-watchdog boot grace to 3600 s — i.e. the bench validates a
#   configuration we would NEVER ship. Standing up a real ThingsBoard here makes
#   the bench exercise the same code path as the fleet.
#
# WHY tb-node + postgres AND NOT tb-postgres (the old all-in-one)
#   thingsboard/tb-node:4.3.1.3 IS the monolith for CE 4.3.x — it is exactly what
#   thingsboard.io/docs/installation/docker publishes for Community Edition, it
#   embeds ALL transports (HTTP/MQTT/CoAP/LwM2M/SNMP) in one JVM, and it runs on
#   the in-memory queue + caffeine cache with no Kafka/Redis. It is ALREADY
#   pulled on this bench (2.32 GB), so the only new bytes are postgres (~150 MB).
#   thingsboard/tb-postgres is the legacy single-container image and is not the
#   documented path for 4.3.x; choosing it would mean a ~2 GB pull to get LESS.
#
# WHY network_mode: host
#   The LwM2M listener must be reachable from the Thread mesh, i.e. on WSL's
#   wpan0 OMR address (fdaf:e549:1751:1:1199:8c2b:a32e:38ee). otbr-agent runs
#   NATIVE in WSL, so sharing WSL's network namespace puts the UDP socket
#   directly on the interface that owns that address. A bridged container has no
#   route onto the mesh and (worse) fails ASYMMETRICALLY: REGISTER can still
#   arrive while every inbound Observe/RPC silently times out. Host mode also
#   avoids needing "enable_ipv6" in the docker daemon config.
#   Consequence: NO `ports:` mapping (it is ignored in host mode) and postgres is
#   reached over 127.0.0.1, not by service name.
#
# PORTS — read this before changing anything
#   LwM2M is pinned to 5683, NOT the TB default 5685, because the firmware's
#   DNS-SD fallback (Strategy 2, otDnsClientResolveAddress) HARDCODES
#   LWM2M_DEFAULT_PORT 5683 (src/lwm2m_discover.c:22,147). Strategy 1 takes the
#   port from the SRV record, so publish the SRP service on 5683 too and both
#   strategies agree. This also matches the production Pi4 Edge.
#   TB's CoAP transport binds 5683 FIRST and then LwM2M dies with
#   "java.net.BindException: Address already in use" (.context/ESTADO.md Bug 1) —
#   hence COAP_ENABLED=false AND COAP_SERVER_ENABLED=false AND COAP_BIND_PORT
#   moved off 5683. All three are required; the first alone is not enough.
#
# Driven by tools/lab_tb/lab_tb_up.sh (inside WSL) / tools/lab_tb/lab_tb.ps1
# (from Windows). See tools/lab_tb/README.md for the runbook.

name: lab-tb

services:

  postgres:
    image: ${TB_PG_IMAGE:-postgres:18}
    container_name: tb-lab-postgres
    restart: unless-stopped
    network_mode: host
    shm_size: 256mb
    environment:
      POSTGRES_DB: thingsboard
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TB_PG_PASSWORD:-postgres}
      PGPORT: ${TB_PG_PORT:-5432}
    volumes:
      # NAMED volume on purpose: a bind mount under /mnt/c would put PGDATA on
      # the 9p filesystem, where postgres fails on permissions/fsync.
      - tb-lab-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thingsboard -h 127.0.0.1 -p ${TB_PG_PORT:-5432}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  thingsboard-ce:
    image: ${TB_IMAGE:-thingsboard/tb-node:4.3.1.3}
    container_name: tb-lab
    restart: unless-stopped
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    environment:
      TB_SERVICE_ID: tb-lab-node

      # --- Single-JVM operation: no Kafka, no Redis -----------------------
      TB_QUEUE_TYPE: "in-memory"
      CACHE_TYPE: "caffeine"

      # --- Database (127.0.0.1 because of host networking) ----------------
      SPRING_DATASOURCE_URL: "jdbc:postgresql://127.0.0.1:${TB_PG_PORT:-5432}/thingsboard"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: ${TB_PG_PASSWORD:-postgres}

      # --- Web UI + REST API (what every tools/tb_*.py talks to) ----------
      HTTP_BIND_ADDRESS: "0.0.0.0"
      HTTP_BIND_PORT: "${TB_HTTP_PORT:-8080}"

      # --- LwM2M transport: THE reason this stack exists ------------------
      # bind_address "::" = IPv6 wildcard. On Linux (net.ipv6.bindv6only=0) the
      # JVM dual-stacks it, so the socket also accepts IPv4 AND, crucially,
      # accepts on wpan0's OMR address. Leshan logs the bind as
      #   "Started endpoint at coap://[0:0:0:0:0:0:0:0]:5683"
      # If you instead see 0.0.0.0:5683 in `ss`, the mesh CANNOT reach it.
      # Do NOT hardcode the OMR address here: it changes when the OTBR reforms.
      LWM2M_ENABLED: "true"
      LWM2M_BIND_ADDRESS: "::"
      LWM2M_BIND_PORT: "${TB_LWM2M_PORT:-5683}"
      LWM2M_SECURITY_BIND_ADDRESS: "::"
      LWM2M_SECURITY_BIND_PORT: "${TB_LWM2M_DTLS_PORT:-5684}"
      # Bootstrap server stays on TB's defaults (5687/5688). The firmware calls
      # lwm2m_rd_client_start() with flags=0 (src/main.c:1500,3500) = NO
      # bootstrap, and the device profile sets bootstrapServerUpdateEnable=false,
      # so these sockets are inert — they are pinned only to keep them off 5683.
      LWM2M_BS_BIND_ADDRESS: "::"
      LWM2M_BS_BIND_PORT: "5687"
      LWM2M_BS_SECURITY_BIND_ADDRESS: "::"
      LWM2M_BS_SECURITY_BIND_PORT: "5688"

      # --- CoAP transport OFF (it would steal 5683 from LwM2M) ------------
      COAP_ENABLED: "false"
      COAP_SERVER_ENABLED: "false"
      COAP_BIND_PORT: "5690"

      # --- Bench sanity: a SED talking every 300 s must not look "offline" --
      # TB's default is 600 s; sparse LwM2M traffic makes the `active` flag flap
      # and the "Node Offline" alarm keys straight off it. Per-device
      # inactivityTimeoutMs (set at provisioning time) still overrides this.
      DEFAULT_INACTIVITY_TIMEOUT: "${TB_INACTIVITY_TIMEOUT_S:-1200}"

      # --- JVM ------------------------------------------------------------
      # preferIPv6Addresses matters: this deployment is IPv6-first.
      JAVA_OPTS: >-
        -Xms${TB_JAVA_XMS:-512m}
        -Xmx${TB_JAVA_XMX:-2048m}
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -Djava.net.preferIPv4Stack=false
        -Djava.net.preferIPv6Addresses=true

    volumes:
      - tb-lab-data:/data
      - tb-lab-logs:/var/log/thingsboard

volumes:
  tb-lab-postgres-data:
    name: tb-lab-postgres-data
  tb-lab-data:
    name: tb-lab-data
  tb-lab-logs:
    name: tb-lab-logs
