<title>AMI Lab e2e Monitor</title>

<!--
  lab_dashboard.html — self-contained instrument console for the AMI benchtop
  e2e lab (OpenThread mesh + LwM2M metering node under real USB power monitoring).

  WHY this file exists
  --------------------
  The lab e2e monitor (tools/lab_e2e_monitor.py) writes a single JSON document,
  tools/lab_e2e_snapshot.json, every cycle. This page renders exactly that
  document. It is fully self-contained (inline CSS + JS, zero network / CDN /
  webfonts) so it can be published verbatim as a claude.ai Artifact and also
  opened straight off disk.

  DATA CONTRACT
  -------------
  The snapshot shape is frozen and shared with the monitor (see the schema in
  the lab bring-up notes). Every numeric field degrades gracefully: a dead
  source arrives as null / 0 / missing and renders as an em-dash, never a crash.

  RE-POINTING AT LIVE DATA
  ------------------------
  The page reads its snapshot from the inline JSON blob below (the script element
  whose id is "lab-data", type application/json) — a realistic sample so the page
  renders immediately. Three ways to drive it with live data, least to most coupling:

    1. Replace that element's text content with the current
       tools/lab_e2e_snapshot.json and reload. (This is what the Artifact
       publisher does each cycle: read the JSON, splice it into the blob,
       re-publish. The id "lab-data" appears on exactly one real element so a
       splice targeting it is unambiguous.)
    2. From anywhere with the parsed object, call  window.renderLab(obj)  — the
       render() entry point is exposed on window and repaints from scratch.
    3. For a standalone (non-Artifact) deployment that may fetch, set
       window.LAB_DATA_URL to the snapshot URL before this script runs; the tiny
       poll loop at the bottom (disabled by default, since the Artifact CSP
       blocks network) will fetch + renderLab on an interval.

  PSU RISK THRESHOLDS (on i_peak_ma; the monitor computes psu_risk, the page also
  documents + falls back to them):  OK < 350 mA  |  WARN 350–499 mA  |  BLOCK >= 500 mA.
  Rationale: a single ESP32-C6 idles ~120–150 mA and bursts to ~250–300 mA on
  Thread/LwM2M TX; sustained peaks approaching 500 mA are the signature of the
  USB-host overcurrent "cliff" that has masqueraded as brownouts in this fleet.
-->

<script>
(function () {
  "use strict";

  // ── PSU-risk thresholds on i_peak_ma (documented; used only as fallback when
  //    the snapshot omits power.psu_risk — the monitor is the source of truth). ──
  var PSU_WARN_MA = 350, PSU_BLOCK_MA = 500;
  var GAUGE_FULL_MA = 600;          // gauge full-scale (BLOCK sits inside the dial)

  // ── tiny helpers ──────────────────────────────────────────────────────────
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c];
    });
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  // format number or em-dash; d = decimals
  function num(v, d) {
    if (!isNum(v)) return "&mdash;";
    return v.toLocaleString("en-US", { minimumFractionDigits: d || 0, maximumFractionDigits: d == null ? 0 : d });
  }
  function intc(v) { return isNum(v) ? Math.round(v).toLocaleString("en-US") : "&mdash;"; }
  function humanBytes(n) {
    if (!isNum(n)) return "&mdash;";
    var u = ["B", "KB", "MB", "GB", "TB"], i = 0, x = n;
    while (x >= 1024 && i < u.length - 1) { x /= 1024; i++; }
    return (i === 0 ? x.toFixed(0) : x.toFixed(x < 10 ? 2 : 1)) + " " + u[i];
  }
  function humanDur(s) {
    if (!isNum(s)) return "&mdash;";
    s = Math.max(0, Math.floor(s));
    var d = Math.floor(s / 86400); s -= d * 86400;
    var h = Math.floor(s / 3600);  s -= h * 3600;
    var m = Math.floor(s / 60);    var sec = s - m * 60;
    if (d > 0) return d + "d " + h + "h";
    if (h > 0) return h + "h " + m + "m";
    if (m > 0) return m + "m " + sec + "s";
    return sec + "s";
  }
  function relAge(iso) {
    var t = Date.parse(iso);
    if (isNaN(t)) return { text: "&mdash;", stale: true };
    var s = Math.max(0, (Date.now() - t) / 1000);
    var stale = s > 90;
    var text;
    if (s < 60) text = Math.round(s) + "s ago";
    else if (s < 3600) text = Math.round(s / 60) + "m ago";
    else if (s < 86400) text = Math.round(s / 3600) + "h ago";
    else text = Math.round(s / 86400) + "d ago";
    return { text: text, stale: stale };
  }

  // status icons (shape carries meaning, not color alone)
  var ICON = {
    ok:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
    warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
    bad:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    off:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/></svg>'
  };
  function pill(kind, label, big) {
    return '<span class="pill ' + kind + (big ? ' big' : '') + '">' + ICON[kind] + esc(label) + '</span>';
  }

  function psuRiskOf(power) {
    if (!power) return "OFF";
    if (typeof power.psu_risk === "string") return power.psu_risk.toUpperCase();
    var pk = power.i_peak_ma;                       // fallback from thresholds
    if (!isNum(pk)) return "OFF";
    if (pk >= PSU_BLOCK_MA) return "BLOCK";
    if (pk >= PSU_WARN_MA) return "WARN";
    return "OK";
  }
  var RISK_KIND = { OK: "ok", WARN: "warn", BLOCK: "bad", OFF: "off" };
  var RISK_VAR  = { OK: "var(--good)", WARN: "var(--warn)", BLOCK: "var(--bad)", OFF: "var(--off)" };

  // ── SVG arc gauge (semicircle) ────────────────────────────────────────────
  function polar(cx, cy, r, deg) {
    var a = deg * Math.PI / 180;
    return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
  }
  // arc along the TOP half: angle 180 (left) -> 360 (right), sweep=1
  function arcPath(cx, cy, r, startDeg, endDeg) {
    var s = polar(cx, cy, r, startDeg), e = polar(cx, cy, r, endDeg);
    var large = (endDeg - startDeg) <= 180 ? 0 : 1;
    return "M " + s.x.toFixed(2) + " " + s.y.toFixed(2) +
           " A " + r + " " + r + " 0 " + large + " 1 " + e.x.toFixed(2) + " " + e.y.toFixed(2);
  }
  function tickAt(cx, cy, r, ma, color) {
    var f = Math.max(0, Math.min(1, ma / GAUGE_FULL_MA));
    var deg = 180 + f * 180;
    var p1 = polar(cx, cy, r - 7, deg), p2 = polar(cx, cy, r + 3, deg);
    return '<line x1="' + p1.x.toFixed(2) + '" y1="' + p1.y.toFixed(2) +
           '" x2="' + p2.x.toFixed(2) + '" y2="' + p2.y.toFixed(2) +
           '" stroke="' + color + '" stroke-width="2" stroke-linecap="round" opacity="0.9"/>';
  }
  function gauge(power) {
    var cx = 100, cy = 100, r = 82;
    var i_ma = power && isNum(power.i_ma) ? power.i_ma : null;
    var peak = power && isNum(power.i_peak_ma) ? power.i_peak_ma : null;
    var risk = psuRiskOf(power);
    var col = RISK_VAR[risk] || "var(--off)";
    var f = i_ma == null ? 0 : Math.max(0, Math.min(1, i_ma / GAUGE_FULL_MA));
    var valDeg = 180 + f * 180;
    var track = arcPath(cx, cy, r, 180, 360);
    var val = i_ma == null ? "" : arcPath(cx, cy, r, 180, valDeg);
    var peakTick = peak == null ? "" : tickAt(cx, cy, r, peak, "var(--ink-2)");
    var valTxt = i_ma == null ? "&mdash;" : i_ma.toFixed(0);
    return '' +
      '<div class="gauge">' +
      '<svg viewBox="0 0 200 122" role="img" aria-label="Bus current ' + valTxt + ' milliamps, risk ' + risk + '">' +
        '<path d="' + track + '" fill="none" stroke="var(--track)" stroke-width="13" stroke-linecap="round"/>' +
        // threshold ticks document the WARN / BLOCK bands right on the dial
        tickAt(cx, cy, r, PSU_WARN_MA, "var(--warn)") +
        tickAt(cx, cy, r, PSU_BLOCK_MA, "var(--bad)") +
        (val ? '<path d="' + val + '" fill="none" stroke="' + col + '" stroke-width="13" stroke-linecap="round"/>' : '') +
        peakTick +
        '<text x="100" y="86" text-anchor="middle" class="g-val" fill="var(--ink)" font-size="30">' + valTxt + '</text>' +
        '<text x="100" y="104" text-anchor="middle" fill="var(--ink-3)" font-size="11" font-family="var(--font-ui)" letter-spacing="0.5">mA  BUS</text>' +
        '<text x="18" y="118" text-anchor="middle" fill="var(--ink-3)" font-size="9">0</text>' +
        '<text x="182" y="118" text-anchor="middle" fill="var(--ink-3)" font-size="9">' + GAUGE_FULL_MA + '</text>' +
      '</svg></div>';
  }

  // ── SVG sparkline (single series, area fill + emphasized endpoint) ─────────
  function sparkline(vals, opt) {
    opt = opt || {};
    var W = 300, H = 64, padT = 6, padB = 8, padX = 2;
    var color = opt.color || "var(--accent)";
    var pts = vals.filter(isNum);
    if (pts.length < 2) {
      return '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none"></svg>' +
             '<div class="empty" style="text-align:center">no history yet</div>';
    }
    var lo = opt.min != null ? opt.min : Math.min.apply(null, pts);
    var hi = opt.max != null ? opt.max : Math.max.apply(null, pts);
    if (hi - lo < 1e-9) { hi = lo + 1; }
    var n = vals.length;
    var xAt = function (i) { return padX + (W - 2 * padX) * (i / (n - 1)); };
    var yAt = function (v) { return padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo)); };
    var d = "", area = "", started = false, lastX = 0, lastY = 0, lastV = null;
    for (var i = 0; i < n; i++) {
      var v = vals[i];
      if (!isNum(v)) continue;
      var x = xAt(i), y = yAt(v);
      d += (started ? " L " : "M ") + x.toFixed(1) + " " + y.toFixed(1);
      if (!started) area = "M " + x.toFixed(1) + " " + (H - padB) + " L " + x.toFixed(1) + " " + y.toFixed(1);
      else area += " L " + x.toFixed(1) + " " + y.toFixed(1);
      started = true; lastX = x; lastY = y; lastV = v;
    }
    area += " L " + lastX.toFixed(1) + " " + (H - padB) + " Z";
    var uid = "sg" + Math.random().toString(36).slice(2, 8);
    return '' +
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="' + esc(opt.aria || "trend") + '">' +
        '<defs><linearGradient id="' + uid + '" x1="0" y1="0" x2="0" y2="1">' +
          '<stop offset="0" stop-color="' + color + '" stop-opacity="0.28"/>' +
          '<stop offset="1" stop-color="' + color + '" stop-opacity="0"/>' +
        '</linearGradient></defs>' +
        '<line x1="0" y1="' + (H - padB) + '" x2="' + W + '" y2="' + (H - padB) + '" stroke="var(--line)" stroke-width="1"/>' +
        '<path d="' + area + '" fill="url(#' + uid + ')"/>' +
        '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
        '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="3.2" fill="' + color + '"/>' +
        '<circle cx="' + lastX.toFixed(1) + '" cy="' + lastY.toFixed(1) + '" r="3.2" fill="none" stroke="var(--surface)" stroke-width="1.4"/>' +
      '</svg>';
  }

  // ── panel renderers ───────────────────────────────────────────────────────
  function renderOtbr(o) {
    var el = $("otbr-panel");
    var up = o && o.up;
    var head = '<div class="panel-head">' +
      '<h2>OTBR &middot; Thread mesh</h2>' +
      '<span class="spacer"></span>' +
      (up ? pill("ok", (o.role || "up")) : pill("off", "offline")) +
      '</div>';
    if (!up) {
      el.innerHTML = head + '<div class="empty">Border router not reachable &mdash; run <span class="mono">docker exec &lt;otbr&gt; ot-ctl state</span>.</div>';
      return;
    }
    var eidRetry = isNum(o.eid_retry) ? o.eid_retry : null;
    var cca = isNum(o.tx_err_cca) ? o.tx_err_cca : null;
    var m = [
      ["Role", esc(o.role || "&mdash;"), ""],
      ["Channel", num(o.channel), ""],
      ["PAN ID", esc(o.panid || "&mdash;"), ""],
      ["Routers", num(o.routers), ""],
      ["Children", num(o.children), ""],
      ["EID resolved", num(o.eid_resolved), ""],
      ["EID retry", num(o.eid_retry), eidRetry ? "warnv" : ""],
      ["TX err (CCA)", num(o.tx_err_cca), (cca && cca > 5) ? "warnv" : ""],
      ["Rx / Tx total", intc(o.rx_total) + '<small>/' + intc(o.tx_total) + '</small>', ""]
    ];
    var cells = m.map(function (row) {
      return '<div class="metric"><div class="k">' + row[0] + '</div>' +
             '<div class="v ' + row[2] + '">' + row[1] + '</div></div>';
    }).join("");
    el.innerHTML = head + '<div class="metrics">' + cells + '</div>';
  }

  function renderPower(p) {
    var el = $("power-panel");
    var risk = psuRiskOf(p);
    var kind = RISK_KIND[risk] || "off";
    var head = '<div class="panel-head"><h2>USB power</h2><span class="spacer"></span>' +
      (risk === "OFF" ? pill("off", "no meter") : pill(kind, "PSU " + risk)) + '</div>';
    if (!p) {
      el.innerHTML = head + '<div class="empty">Power meter source down.</div>';
      return;
    }
    var stats =
      stat("Bus", num(p.v_bus, 2), "V") +
      stat("Power", num(p.p_w, 3), "W") +
      stat("Charge", num(p.mah_cum, 1), "mAh") +
      stat("Energy", num(p.wh_cum, 3), "Wh") +
      stat("Peak I", num(p.i_peak_ma, 0), "mA") +
      stat("Samples", intc(p.samples), "");
    el.innerHTML = head +
      '<div class="power-body">' + gauge(p) +
        '<div class="power-stats">' + stats + '</div>' +
      '</div>' +
      '<div class="psu-legend">Dial ticks mark <b>WARN ' + PSU_WARN_MA + ' mA</b> and <b>BLOCK ' + PSU_BLOCK_MA +
      ' mA</b> peak-current bands. Grey tick = observed peak.</div>';
    function stat(k, v, u) {
      return '<div class="pstat"><div class="k">' + k + '</div><div class="v">' + v +
             (u ? '<small>' + u + '</small>' : '') + '</div></div>';
    }
  }

  function renderSparks(hist) {
    hist = hist || [];
    var cur = hist.map(function (h) { return h && isNum(h.i_ma) ? h.i_ma : NaN; });
    var av  = hist.map(function (h) { return h && isNum(h.availability) ? h.availability : NaN; });
    var curNow = lastFinite(cur), avNow = lastFinite(av);
    var curVals = cur.filter(isNum), avVals = av.filter(isNum);

    $("spark-current").innerHTML =
      '<div class="spark-head"><span class="eyebrow">Bus current</span>' +
      '<span class="now" style="color:var(--accent)">' + (curNow == null ? "&mdash;" : curNow.toFixed(0) + ' <small style="color:var(--ink-3);font-weight:500">mA</small>') + '</span></div>' +
      sparkline(cur, { color: "var(--accent)", aria: "bus current over time" }) +
      foot(curVals, 0, "mA");

    $("spark-avail").innerHTML =
      '<div class="spark-head"><span class="eyebrow">Availability</span>' +
      '<span class="now" style="color:var(--series-avail)">' + (avNow == null ? "&mdash;" : avNow.toFixed(1) + ' <small style="color:var(--ink-3);font-weight:500">%</small>') + '</span></div>' +
      sparkline(av, { color: "var(--series-avail)", min: Math.max(0, Math.min.apply(null, avVals.length ? avVals : [0]) - 1), max: 100, aria: "availability percent over time" }) +
      foot(avVals, avVals.length && Math.min.apply(null, avVals) > 95 ? 1 : 0, "%");

    function foot(vals, d, u) {
      if (!vals.length) return '<div class="foot"><span>&mdash;</span><span>' + vals.length + ' pts</span></div>';
      return '<div class="foot"><span>min ' + Math.min.apply(null, vals).toFixed(d) + u +
             '</span><span>max ' + Math.max.apply(null, vals).toFixed(d) + u +
             '</span><span>' + vals.length + ' pts</span></div>';
    }
  }
  function lastFinite(arr) { for (var i = arr.length - 1; i >= 0; i--) if (isNum(arr[i])) return arr[i]; return null; }

  // ── node card ─────────────────────────────────────────────────────────────
  function counter(k, v, badWhenNonzero) {
    var cls = "zero";
    if (isNum(v) && v > 0) cls = badWhenNonzero ? "nonzero-bad" : "nonzero-ok";
    return '<div class="counter"><div class="k">' + k + '</div><div class="v ' + cls + '">' + num(v) + '</div></div>';
  }
  function osiBarRow(label, sub, value, maxv, fmt) {
    var w = (isNum(value) && isNum(maxv) && maxv > 0) ? Math.max(2, (value / maxv) * 100) : 0;
    return '<div class="bar-row">' +
      '<span class="lyr">' + label + (sub ? ' <small>' + sub + '</small>' : '') + '</span>' +
      '<span class="bar"><span style="width:' + w.toFixed(1) + '%"></span></span>' +
      '<span class="val">' + fmt(value) + '</span></div>';
  }
  function nodeCard(nd) {
    var reachable = !!(nd && nd.reachable);
    var avail = isNum(nd.availability_pct) ? nd.availability_pct : null;
    var availKind = avail == null ? "off" : (avail >= 99 ? "ok" : (avail >= 95 ? "warn" : "bad"));
    var availColor = availKind === "ok" ? "var(--good)" : availKind === "warn" ? "var(--warn)" : availKind === "bad" ? "var(--bad)" : "var(--off)";

    // header status: reachable + clean counters -> ok; reachable + any incident -> warn; unreachable -> bad
    var incident = (isNum(nd.wdog) && nd.wdog > 0) || (isNum(nd.recover) && nd.recover > 0) || (isNum(nd.resets) && nd.resets > 0);
    var hstat = !reachable ? pill("bad", "unreachable") : (incident ? pill("warn", "watch") : pill("ok", "online"));

    var head = '<div class="card-top"><div class="row1">' +
      '<span class="name">' + esc(nd.name || "node") + '</span>' +
      '<span class="fwtag">' + esc(nd.fw || "?") + '</span>' +
      '<span style="margin-left:auto">' + hstat + '</span></div>' +
      '<div class="omr" title="' + esc(nd.omr || "") + '">' + esc(nd.omr || "&mdash;") + '</div></div>';

    if (!reachable) {
      return '<article class="card unreachable">' + head +
        '<div class="card-body"><div class="empty">No CoAP /diag answer over IPv6 &mdash; node off-mesh or diag server down. ' +
        'Last role <span class="mono">' + esc(nd.role || "?") + '</span>, rloc16 <span class="mono">' + esc(nd.rloc16 || "?") + '</span>.</div></div></article>';
    }

    // role/uptime line
    var meta = '<div class="counter-strip" style="grid-template-columns:repeat(3,1fr)">' +
      '<div class="counter"><div class="k">Role</div><div class="v" style="font-size:14px">' + esc(nd.role || "&mdash;") + '</div></div>' +
      '<div class="counter"><div class="k">Uptime</div><div class="v" style="font-size:14px">' + humanDur(nd.uptime_s) + '</div></div>' +
      '<div class="counter"><div class="k">RLOC16</div><div class="v" style="font-size:14px">' + esc(nd.rloc16 || "&mdash;") + '</div></div>' +
      '</div>';

    var counters = '<div class="counter-strip">' +
      counter("reg_ok", nd.reg_ok, false) +
      counter("recover", nd.recover, true) +
      counter("wdog", nd.wdog, true) +
      counter("resets", nd.resets, true) +
      '</div>';

    var lastSeen = isNum(nd.last_seen_s) ? nd.last_seen_s + "s ago" : "&mdash;";
    var availBlock = '<div class="avail"><div class="row">' +
      '<span class="eyebrow">Availability</span>' +
      '<span class="pct" style="color:' + availColor + '">' + (avail == null ? "&mdash;" : avail.toFixed(1) + "%") + '</span></div>' +
      '<div class="meter"><span style="width:' + (avail == null ? 0 : Math.max(0, Math.min(100, avail))) + '%;background:' + availColor + '"></span></div>' +
      '<div style="font-size:10px;color:var(--ink-3);margin-top:4px">last diag ' + lastSeen + '</div></div>';

    // OBIS quad
    var a = nd.ami || {};
    var obis = '<div><div class="eyebrow" style="margin-bottom:6px">Live OBIS</div><div class="obis">' +
      obisCell("Voltage", a.voltage, 1, "V") +
      obisCell("Current", a.current, 2, "A") +
      obisCell("Power", a.power, 1, "W") +
      obisCell("Freq", a.freq, 2, "Hz") +
      '</div></div>';

    // OSI breakdown
    var o = nd.osi || {};
    var byteMax = Math.max(o.l3_ipv6_bytes || 0, o.l4_udp_coap_bytes || 0, o.l7_lwm2m_tx_bytes || 0, 1);
    var frameMax = Math.max(o.l2_mac_tx || 0, o.l2_mac_rx || 0, 1);
    var osi = '<div class="osi"><div class="eyebrow" style="margin-bottom:2px">OSI throughput <span style="color:var(--ink-3);font-weight:500;letter-spacing:0.02em">(cumulative)</span></div>' +
      '<div class="subhead">Payload &middot; bytes</div>' +
      osiBarRow("L3", "IPv6", o.l3_ipv6_bytes, byteMax, humanBytes) +
      osiBarRow("L4", "UDP/CoAP", o.l4_udp_coap_bytes, byteMax, humanBytes) +
      osiBarRow("L7", "LwM2M tx", o.l7_lwm2m_tx_bytes, byteMax, humanBytes) +
      '<div class="subhead">Link &middot; MAC frames</div>' +
      osiBarRow("L2", "tx", o.l2_mac_tx, frameMax, intc) +
      osiBarRow("L2", "rx", o.l2_mac_rx, frameMax, intc) +
      '<div class="osi-chips">' +
        chip("app msgs", intc(o.app_msgs), "") +
        chip("rate", num(o.bytes_per_min, 1), "B/min") +
        chip("avg pkt", num(o.avg_pkt_bytes, 1), "B") +
      '</div></div>';

    return '<article class="card">' + head + '<div class="card-body">' +
      meta + counters + availBlock + obis + osi + '</div></article>';

    function obisCell(k, v, d, u) {
      return '<div class="cell"><div class="k">' + k + '</div><div class="v">' + num(v, d) +
             '<small>' + u + '</small></div></div>';
    }
    function chip(k, v, u) {
      return '<div class="chip"><div class="k">' + k + '</div><div class="v">' + v +
             (u ? '<small>' + u + '</small>' : '') + '</div></div>';
    }
  }

  // ── overall health ────────────────────────────────────────────────────────
  function overallHealth(d) {
    var otbrUp = d.otbr && d.otbr.up;
    var nodes = Array.isArray(d.nodes) ? d.nodes : [];
    var anyReach = nodes.some(function (n) { return n && n.reachable; });
    var risk = psuRiskOf(d.power);

    if (!otbrUp || !anyReach || risk === "BLOCK") return { kind: "bad", label: "Fault" };

    var degraded =
      risk === "WARN" ||
      (d.otbr && isNum(d.otbr.eid_retry) && d.otbr.eid_retry > 0) ||
      nodes.some(function (n) {
        return n && n.reachable && (
          (isNum(n.wdog) && n.wdog > 0) ||
          (isNum(n.recover) && n.recover > 0) ||
          (isNum(n.resets) && n.resets > 0) ||
          (isNum(n.availability_pct) && n.availability_pct < 99)
        );
      }) ||
      nodes.some(function (n) { return n && !n.reachable; });   // some (but not all) down

    return degraded ? { kind: "warn", label: "Degraded" } : { kind: "ok", label: "Nominal" };
  }

  // ── entry point ───────────────────────────────────────────────────────────
  function render(d) {
    d = d || {};
    // header time + live dot
    var abs = $("snap-abs"), rel = $("snap-rel"), dot = $("live-dot");
    if (d.ts_iso) {
      var t = new Date(d.ts_iso);
      abs.textContent = isNaN(t) ? d.ts_iso : t.toLocaleString([], { hour12: false });
      var age = relAge(d.ts_iso);
      rel.innerHTML = age.text;
      dot.classList.toggle("stale", age.stale);
    } else {
      abs.textContent = "no snapshot";
      rel.textContent = "--"; dot.classList.add("stale");
    }

    var h = overallHealth(d);
    var hp = $("health-pill");
    hp.className = "pill big " + h.kind;
    hp.innerHTML = ICON[h.kind] + h.label;

    renderOtbr(d.otbr);
    renderPower(d.power);
    renderSparks(d.history);

    var nodes = Array.isArray(d.nodes) ? d.nodes : [];
    $("nodes").innerHTML = nodes.length
      ? nodes.map(nodeCard).join("")
      : '<div class="panel empty">No nodes in snapshot.</div>';
    var reach = nodes.filter(function (n) { return n && n.reachable; }).length;
    $("nodes-count").textContent = reach + " / " + nodes.length + " reachable";

    $("foot-power").textContent = (d.power && d.power.source) ? d.power.source : "—";
  }
  // exposed so a live harness can push fresh snapshots:  window.renderLab(obj)
  window.renderLab = render;

  function loadInline() {
    var node = document.getElementById("lab-data");
    if (!node) return {};
    try { return JSON.parse(node.textContent); }
    catch (e) { console.error("lab-data parse error", e); return {}; }
  }

  // ── theme toggle (also honored by the Artifact viewer's data-theme stamp) ──
  function initTheme() {
    var btn = $("theme-toggle");
    var saved = null;
    try { saved = localStorage.getItem("ami-lab-theme"); } catch (e) {}
    if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
    btn.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      if (!cur) cur = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("ami-lab-theme", next); } catch (e) {}
    });
  }

  // ── boot ──────────────────────────────────────────────────────────────────
  initTheme();
  render(loadInline());

  // keep the "N s ago" label honest between snapshots
  setInterval(function () {
    var node = $("snap-rel"), dot = $("live-dot");
    var data = loadInline();
    if (data && data.ts_iso && node) {
      var age = relAge(data.ts_iso);
      node.innerHTML = age.text;
      if (dot) dot.classList.toggle("stale", age.stale);
    }
  }, 5000);

  // OPTIONAL live polling for a standalone (non-Artifact) deployment. Disabled
  // unless window.LAB_DATA_URL is set, because the Artifact CSP blocks network.
  if (window.LAB_DATA_URL) {
    var poll = function () {
      fetch(window.LAB_DATA_URL, { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (obj) { window.renderLab(obj); })
        .catch(function (e) { console.warn("lab poll failed (source down?)", e); });
    };
    poll();
    setInterval(poll, window.LAB_POLL_MS || 15000);
  }
})();
</script>
