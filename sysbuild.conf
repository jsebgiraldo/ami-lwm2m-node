# Sysbuild configuration — only consumed when building with `west build --sysbuild`.
#
# v0.6.27 OTA: enable the MCUboot bootloader image. sysbuild builds two
# images: the MCUboot 2nd-stage bootloader (flashed at 0x0 / boot_partition)
# and this app, signed + headered, linked to run from slot0_partition
# (0x20000). MCUboot validates the signature/header at boot and chain-loads
# slot0, or swaps in a pending image from slot1 after an OTA.
#
# The legacy non-sysbuild build (tools/build_firmware.py) is unaffected: it
# never passes --sysbuild, so this file is ignored and the monolithic
# image-at-0x0 build still works for nodes not yet migrated to MCUboot.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
